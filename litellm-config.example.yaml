# Forge 1.0 gateway. One explicit model, no tier aliases, no embedded secret.
# Point model/api_base/extra_headers at the upstream you actually call.
# Set the Postgres database TimeZone to UTC before relying on key expiry.
model_list:
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      max_retries: 0
      num_retries: 0
      # extra_headers:
      #   x-opencode-session: os.environ/OPENCODE_SESSION
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  fail_closed_budget_enforcement: true
  disable_budget_reservation: false
router_settings:
  num_retries: 0
litellm_settings:
  callbacks: [forge_budget_guard.guard]
  num_retries: 0
  request_timeout: 60
  set_verbose: false
  drop_params: false

name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Nightly: runs everything, including the manual-only integration-os job
  # below. Push/PR runs never touch it — real OS-process failure injection
  # (worker subprocesses, SIGKILL drills) adds ~10 minutes and must not slow
  # the main gate.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

# Pushes to the same branch cancel superseding runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the prose lint diffs against the base commit

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Dependency graph (all distributions)
        run: |
          uv run deptry src/forge
          uv run deptry packages/forge-protocol/src/forge_protocol --config packages/forge-protocol/pyproject.toml
          uv run deptry packages/forge-lane/src/forge_lane --config packages/forge-lane/pyproject.toml

      - name: Import contracts
        run: uv run lint-imports

      - name: Exact authority owners and complete store boundary
        run: uv run python scripts/check_authority_boundaries.py pyproject.toml

      - name: Protocol schema drift
        run: uv run python -m forge_protocol.schema --check

      - name: Size ratchet (oversized code may only shrink)
        run: uv run python scripts/ratchet.py

      - name: Prose-only AST and directive equivalence
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'prose-diet')
        run: >-
          uv run python scripts/ast_equivalence.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Prose lint (added lines)
        run: |
          base="${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'origin/main' }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=origin/main
          uv run python scripts/prose_lint.py --base "$base"

      # R38-03 (#304): refuse database-archive artifacts (PGDMP magic, pg_dump
      # extensions, archives containing dump members) in the tracked tree
      # outside the reviewed synthetic-fixture allowlist, and validate the
      # sanitized backup receipts. Stdlib-only — fast, lint-adjacent.
      - name: Public-artifact gate (no database archives in tracked files)
        run: uv run python scripts/gate_public_artifacts.py


  workspace-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build every distribution
        run: uv build --all
      - name: Verify installed-wheel database bootstrap
        run: |
          uv sync --all-packages
          uv run pytest -q tests/test_wheel_migrations.py
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-distributions
          path: dist/*

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-packages --extra claude --extra postgres

      - name: Mypy (all production packages, strict and blocking)
        run: >-
          uv run mypy --strict src/forge
          packages/forge-protocol/src/forge_protocol
          packages/forge-lane/src/forge_lane

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests (default tier)
        run: uv run pytest -q -m "not slow" --durations=30

  # The slow tier: real processes and services (tests/production_entry,
  # tests/test_failure_injection_os.py). Not run on pull requests, except the
  # files the Invariant Suite registers (the invariants job) and pg_gate's
  # production-entry selection; pg_gate ignores the leaked-process check.
  tests-slow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests (slow tier)
        run: uv run pytest -q -m slow

  # ADR-0035 / DESIGN §4: the Invariant Suite (I1-I8) must execute, never skip.
  # The registry selects the files; every test in them runs.
  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
      FORGE_ENGINE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with the postgres extra)
        run: uv sync --all-packages --extra postgres

      - name: Invariant Suite
        run: >-
          uv run pytest -q --junitxml=invariants.xml
          $(uv run python -m tests.invariants.registry)

      - name: Every invariant test executed
        run: uv run python scripts/assert_no_skips.py invariants.xml

  # Diff coverage: new and changed lines need at least 85% coverage.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Default tier with coverage
        run: uv run pytest -q -m "not slow" --cov=forge --cov=forge_protocol --cov=forge_lane --cov=scripts --cov-report=xml

      - name: Diff coverage (at least 85% of changed lines)
        run: >-
          uv run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }} --fail-under=85

  # Real-Postgres integration stage (F29): the ADR-0017 failure-injection
  # exit bar (tests/test_failure_injection.py) runs only when
  # FORGE_PG_TEST_URL is set — without the service it self-skips, so this
  # job is the one place the durable exit bar is actually enforced. No
  # continue-on-error: pass/fail gates the workflow. Since R36-08 (#267)
  # the job ALSO runs the required PostgreSQL qualification gate (PE-4 +
  # the checkpoint GC/repository/retry-authority traces on alembic-provisioned
  # disposable databases) — see the gate step below and scripts/pg_gate.py;
  # its report artifact is the qualification evidence.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A second PostgreSQL for the qualification gate. The gate installs
      # its own disposable databases through the packaged schema command.
      postgres-gate:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The job runs directly on the runner VM, so the service containers are
      # reached via the mapped localhost ports (GitHub's documented pattern
      # for non-container jobs), not via the service label hostnames.
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
      FORGE_ENGINE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with the postgres extra)
        run: uv sync --all-packages --extra postgres

      - name: Failure-injection exit bar (real Postgres)
        run: uv run pytest tests/test_failure_injection.py -q

      # The qualification gate installs disposable databases with
      # `python -m forge.store.schema init` on the postgres-gate service.
      # It refuses when the URL is missing, a required id is absent, a
      # required test skips, or the schema is not the packaged baseline.
      - name: Run the required PostgreSQL qualification gate
        env:
          FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5433/forge
        run: uv run python scripts/pg_gate.py --report pg-gate.json

      - name: Upload the qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-gate-qualification-report
          path: pg-gate.json

  # Nightly crash recovery on PostgreSQL. The 0.42 worker and GitLab stub
  # are gone, so this job runs the current failure-injection suite. A
  # ReadTimeout from a native peer is a typed transport failure and cannot
  # leave a run waiting on the removed waiting_ci state.
  integration-os:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
      FORGE_ENGINE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with the postgres extra)
        run: uv sync --all-packages --extra postgres

      - name: Crash recovery on PostgreSQL
        run: uv run pytest tests/test_failure_injection.py -q

  # Installed-image canary: explicit schema installation, zero-DDL startup,
  # refusal of historical schemas, readiness and authenticated API boundary.
  # Native/model peers are synthetic; offline history cutover and live
  # release acceptance remain separate gates. The release workflow probes
  # the same immutable registry image before moving mutable tags.
  release-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the canary image
        run: docker build -f Dockerfile -t forge:canary .

      # Stdlib-only script: no uv sync needed, it only drives the runtime CLI.
      - name: Canary the built image
        run: |
          python3 tools/canary_smoke.py forge:canary \
            --allow-unpinned \
            --runtime docker \
            --stages fresh

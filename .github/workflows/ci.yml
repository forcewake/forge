name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: runs everything, including the manual-only integration-os job
  # below. Push/PR runs never touch it — real OS-process failure injection
  # (worker subprocesses, SIGKILL drills) adds ~10 minutes and must not slow
  # the main gate.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Pushes to the same branch cancel superseding runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # R38-03 (#304): refuse database-archive artifacts (PGDMP magic, pg_dump
      # extensions, archives containing dump members) in the tracked tree
      # outside the reviewed synthetic-fixture allowlist, and validate the
      # sanitized backup receipts. Stdlib-only — fast, lint-adjacent.
      - name: Public-artifact gate (no database archives in tracked files)
        run: uv run python scripts/gate_public_artifacts.py

      # R38-16 (#317): the native template + secret-consumer conformance
      # gate, on EVERY push (the PG profiles stay on the integration job).
      # Three checks, executed for real: (1) every shipped SDK-lane recipe
      # YAML-parsed and its finalization shell executed VERBATIM under real
      # bash (success/failure/no-op/restored-generation) with the #302
      # unconditional-exit mutation replayed as a caught self-test; (2) the
      # templates' declared dispatch surfaces validated against the CAPTURED
      # production dispatch payloads (scripts/conformance_dispatch_captures.json
      # — recorded through the production-entry fakes, drift-pinned by
      # tests/test_gate_conformance.py); (3) the #303 credential-consumption
      # blocks executed with delivered-vs-ambient sentinels (a dropped
      # consumer mapping fails despite a correct-looking receipt). Exit
      # codes: 2 prerequisite · 3 recipe · 4 schema · 5 sentinel · 6 the
      # gate proved itself insensitive (mutation escape).
      - name: Native template & secret-consumer conformance
        run: uv run python scripts/gate_conformance.py --report conformance-gate.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-gate-report
          path: conformance-gate.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Blocking since F29: the core packages (durable state machine, runs
      # services, repository, factory agents, execution, integrations) must
      # pass mypy cleanly — a regression here fails the workflow.
      - name: Mypy (core packages, blocking)
        run: >-
          uv run mypy src/forge/durable src/forge/runs src/forge/repository
          src/forge/factory src/forge/execution src/forge/integrations

      # TODO(F29 follow-up): the legacy surface (worker, orchestrator,
      # gateway, agents, flows, stores, utils, harness_entry, main,
      # mcp_client, database) still carries ~46 mypy errors. They are
      # reported below but do NOT fail CI. Shrink this count to zero, then
      # fold the legacy surface into the blocking step above and delete this
      # job step.
      - name: Mypy (legacy surface, non-blocking — tracked debt)
        run: uv run mypy src/forge
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  # Real-Postgres integration stage (F29): the ADR-0017 failure-injection
  # exit bar (tests/test_failure_injection.py) runs only when
  # FORGE_PG_TEST_URL is set — without the service it self-skips, so this
  # job is the one place the durable exit bar is actually enforced. No
  # continue-on-error: pass/fail gates the workflow. Since R36-08 (#267)
  # the job ALSO runs the required PostgreSQL qualification gate (PE-4 +
  # the checkpoint GC/repository/retry-authority traces on alembic-provisioned
  # disposable databases) — see the gate step below and scripts/pg_gate.py;
  # its report artifact is the qualification evidence.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # R36-08 (#267): a SECOND, dedicated PostgreSQL for the required
      # qualification gate below — the gate provisions its own disposable
      # databases (via the alembic chain) on a container nothing else in
      # this job touches, mapped to a different host port so the
      # failure-injection bar keeps 5432 to itself.
      postgres-gate:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The job runs directly on the runner VM, so the service containers are
      # reached via the mapped localhost ports (GitHub's documented pattern
      # for non-container jobs), not via the service label hostnames.
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with the postgres extra)
        run: uv sync --extra postgres

      - name: Failure-injection exit bar (real Postgres)
        run: uv run pytest tests/test_failure_injection.py -q

      # R36-08 (#267, AT-09): the REQUIRED PostgreSQL qualification gate.
      # The mandatory selection — tests/production_entry/ (PE-4) plus the
      # checkpoint GC / repository / retry-authority traces — runs on this
      # SHA against disposable databases PROVISIONED THROUGH THE ALEMBIC
      # CHAIN on the postgres-gate service. The runner refuses (non-zero,
      # with the report artifact still uploaded) when FORGE_PG_TEST_URL is
      # missing or unreachable, when a required test id vanished from the
      # collected manifest (marker-removal mutation), when a required test
      # skipped, or when the schema is not at the migration head — a green
      # gate can never be built from skipped tests.
      - name: Run the required PostgreSQL qualification gate
        env:
          FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5433/forge
        run: uv run python scripts/pg_gate.py --report pg-gate.json

      - name: Upload the qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-gate-qualification-report
          path: pg-gate.json

  # Real-OS-process failure injection (review R20): tests/
  # test_failure_injection_os.py drives REAL `python -m forge.worker`
  # subprocesses to each checkpoint and SIGKILLs them, against the real
  # Postgres lab (schema from `python -m forge.migrate`, R22). The worker
  # requires Redis, so this job needs both services. Nightly / manual only:
  # process spawns plus the worker's real 5s/15s/30s poll cadences put the
  # suite around 10 minutes — kept OFF the PR gate.
  integration-os:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same runner-VM pattern as the integration job above: the service
      # containers are reached via their mapped localhost ports.
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
      FORGE_OS_FI_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with the postgres extra)
        run: uv sync --extra postgres

      - name: OS-process failure injection (SIGKILL drills on real workers)
        run: uv run pytest tests/test_failure_injection_os.py -q

  # Release-artifact canary (review R30): builds the Containerfile from the
  # pushed commit and runs scripts/canary_smoke.py against the BUILT IMAGE —
  # the real alembic chain on a fresh Postgres (R22: never create_all), the
  # boot gate at head, /health ok, MCP mount fail-closed (401), doctor on the
  # in-container env — plus the previous-release → this-tree schema upgrade
  # when ghcr.io/forcewake/forge:latest is pullable (first release or a
  # private registry: the stage self-skips). Nightly / manual only, next to
  # integration-os: container build + pulls add minutes and must not sit on
  # the PR gate. The tag-triggered release workflow runs the SAME script
  # against the pushed digest before any mutable tag moves.
  release-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the canary image
        run: docker build -f Containerfile -t forge:canary .

      # Stdlib-only script: no uv sync needed, it only drives the runtime CLI.
      - name: Canary the built image
        run: |
          python3 scripts/canary_smoke.py forge:canary \
            --allow-unpinned \
            --previous-image ghcr.io/forcewake/forge:latest \
            --stages fresh,migrate

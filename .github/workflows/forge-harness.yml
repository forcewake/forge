# forge harness lane — DOGFOODING (ADR-0020/0022)
#
# This repo is developed THROUGH forge itself: an issue comment /implement
# (or the "forge" label) plans the work, a human /go consumes the gate, and
# this dispatch-only workflow runs the coding agent in an ephemeral runner.
# The lane has NO write credential and NO forge secret; its only output is
# the candidate artifact the trusted publisher validates and pushes as a
# Draft PR. The PINNED_REF below tracks main — this repo IS the product.
# forge harness executor for GitHub Actions (ADR-0016/0019, Stage E3b)
#
# Human-applied to the TARGET repository at onboarding (mirrors the GitLab
# onboarding): this workflow is what forge dispatches when a run needs a
# coding agent. The agent runs in GitHub's ephemeral runner — the lane has
# NO write credentials and NO forge secrets; its only output is the
# candidate artifact, which the forge trusted publisher validates and
# publishes (create_commit_on_branch + Draft PR).
#
# Dispatched by forge via workflow_dispatch with inputs:
#   run_id, attempt_base_oid, driver, model, issue_number, plan_note_id,
#   envelope_digest, spec_digest
#   (see forge.execution.github_actions; the approved plan/task bytes are
#   fetched by the lane from the plan comment addressed by plan_note_id and
#   re-verified against envelope_digest + spec_digest — A03: fail-closed on
#   any post-approval byte change; no input size limits; empty
#   envelope_digest = legacy replay, unenforced)
#
# The driver step is rendered by forge's HarnessDriver.build_script()
# (Stage D) — the template only provisions the lane.

name: forge-harness

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "forge run id"
        required: true
        type: string
      attempt_base_oid:
        description: "frozen attempt base (detached checkout)"
        required: true
        type: string
      driver:
        description: "harness driver: claude-code | grok-build | opencode | copilot | claude-sdk-lane"
        required: true
        type: string
      model:
        description: "model route from the approved RunSpec"
        required: false
        default: ""
        type: string
      issue_number:
        description: "issue whose forge plan comment carries the approved plan"
        required: true
        type: string
      plan_note_id:
        description: "issue comment id of the approved forge plan (empty = legacy scan)"
        required: false
        default: ""
        type: string
      envelope_digest:
        description: >-
          sha256 of the approved brief envelope (A03; the lane re-verifies the
          comment's approved bytes against it, fail-closed; empty = legacy replay)
        required: false
        default: ""
        type: string
      spec_digest:
        description: "digest of the frozen executable RunSpec the envelope binds (A03)"
        required: false
        default: ""
        type: string
      repair_context:
        description: "bounded verification-failure context (repair re-dispatch)"
        required: false
        default: ""
        type: string

concurrency:
  group: forge-${{ inputs.run_id }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    # Above the run-side FORGE_HARNESS_TIMEOUT_SECONDS (5400s) so the
    # harness deadline classifies honestly (harness_timeout) instead of
    # GitHub killing the job as 'cancelled' at 60m (LIVE-found).
    timeout-minutes: 120
    # READ-ONLY: the lane fetches the issue body + the forge plan comment
    # to render .forge/brief.md (forge.harness_entry --render-brief). No
    # write permission is granted — the candidate travels as an artifact.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout target at the frozen attempt base (detached)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.attempt_base_oid }}
          fetch-depth: 0
          # No credentials are configured for push; persist-credentials is
          # disabled so nothing actionable remains in .git/config.
          persist-credentials: false

      - name: Disable push (proposal-only lane, ADR-0016)
        run: git remote set-url --push origin FORBIDDEN

      - name: Forge control directory
        run: |
          mkdir -p .forge && echo ".forge/" >> .git/info/exclude 2>/dev/null || true
          # codegraph's SQLite graph DB must never reach the candidate diff
          # (same fail-closed publisher posture as .forge/).
          echo ".codegraph/" >> .git/info/exclude 2>/dev/null || true
          echo "__pycache__/" >> .git/info/exclude 2>/dev/null || true
          echo "*.pyc" >> .git/info/exclude 2>/dev/null || true
          # uv sync creates the workspace venv - lane infrastructure, never
          # a deliverable.
          echo ".venv/" >> .git/info/exclude 2>/dev/null || true
          # The emit step's staging directory is lane infrastructure too —
          # it must never leak into a git add (belt and braces: the emit
          # step stages it only AFTER its own git add -A).
          echo "forge-output/" >> .git/info/exclude 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The lane receives ONLY harness credentials, injected as secrets by
      # the repo owner (never forge's publisher token) — R15: gated per
      # driver in the step below, so a driver never sees another provider's
      # key (capability/credential pairs: provider-native subscriptions are
      # not interchangeable API keys):
      #   claude-code: ANTHROPIC_* / ZAI_API_KEY   opencode: ZAI_API_KEY
      #   grok-build: FORGE_GROK_AUTH              copilot: COPILOT_GITHUB_TOKEN
      # Set explicitly in repo Actions secrets.
      - name: Render the implementation brief
        env:
          # Read-only runner token: fetches the forge plan comment (the
          # APPROVED plan + task bytes) and renders .forge/brief.md via the
          # shared prompt builder. The live issue body is NOT read for the
          # task text on the enforced path (A03). Nothing is written to
          # the repository.
          GITHUB_TOKEN: ${{ github.token }}
          FORGE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          # R05: bind the brief to the EXACT approved plan comment — the
          # journaled id of the comment forge posted with the plan, fetched
          # by id and validated (author + "Forge plan" header + this run's
          # id) fail-closed. Empty on a legacy replay: the lane then falls
          # back to the heuristic scan, loudly unenforced.
          FORGE_PLAN_NOTE_ID: ${{ inputs.plan_note_id }}
          # A03: the approved BriefEnvelope — the lane extracts the approved
          # task/plan sections from that comment, re-computes this digest
          # over exactly those bytes and fails closed on mismatch
          # ("approved brief bytes changed after approval (re-approval
          # required)"). Both empty on a legacy replay: the lane then reads
          # the task text LIVE, loudly unenforced.
          FORGE_ENVELOPE_DIGEST: ${{ inputs.envelope_digest }}
          FORGE_SPEC_DIGEST: ${{ inputs.spec_digest }}
          # The run id the plan comment must mention (tamper guard: another
          # run's plan can never ride this lane's brief).
          FORGE_RUN_ID: ${{ inputs.run_id }}
          # Bounded verification-failure context on a repair re-dispatch
          # (empty on cycle 1).
          FORGE_REPAIR_CONTEXT: ${{ inputs.repair_context }}
          # Same source the driver reads: when it carries the `codegraph`
          # server, the brief names its tools AND this step indexes the
          # repo for it (pinned; telemetry off; local exclude above).
          FORGE_HARNESS_MCP: ${{ vars.FORGE_HARNESS_MCP }}
        run: |
          # A18 environment classification: a FAILED environment bootstrap
          # is lane INFRASTRUCTURE/CONFIG — the environment never matched
          # the approved execution profile — and is classified
          # infrastructure (blocked), never a code-repair candidate. The
          # classification is mechanical: this step writes
          # .forge/bootstrap (ok|failed) for the candidate meta and echoes
          # the FORGE_BOOTSTRAP_FAILED marker into the job log (the
          # control plane's log classifier carries it).
          pip install "forge @ git+https://github.com/forcewake/forge@main" || {
            echo "failed" > .forge/bootstrap
            echo "FORGE_BOOTSTRAP_FAILED: the pinned forge lane code failed to install (missing tool - infrastructure/config, never code repair)"
            exit 1
          }
          # The brief's quality bar tells the agent to run the tests — the
          # lane must carry the tooling for that (LIVE-found: bare hosted
          # python has no pytest, and the agent burned turns on denied
          # attempts to check).
          # PIN to the repo's own lock when it has one: a pip-latest ruff
          # formats differently than the CI-pinned one and every candidate
          # fails lint with "Would reformat" (LIVE-found on PR #30 — the
          # drift burned two repair cycles on a healthy candidate).
          RUFF_VER=$(grep -A1 '^name = "ruff"$' uv.lock 2>/dev/null | grep -m1 -o '"[0-9][^"]*"' | tr -d '"')
          PYTEST_VER=$(grep -A1 '^name = "pytest"$' uv.lock 2>/dev/null | grep -m1 -o '"[0-9][^"]*"' | tr -d '"')
          # Carry the SAME environment the repo's own gates run in: when the
          # target has a uv.lock, sync it (mypy/ruff/pytest + all runtime deps
          # at locked versions) so the agent can run the exact commands CI
          # enforces - `uv run mypy` without the deps is a lie. Fallback for
          # lock-less repos: minimal pip toolchain.
          if [ -f uv.lock ]; then
            pip install uv || true
            # Deterministic install (A18): --frozen materializes EXACTLY the
            # repo's lock — the same build/test contract target CI runs,
            # never a lane-time re-resolution. On failure the pinned minimal
            # toolchain still installs so the lane can finish and report the
            # bootstrap failure honestly (classification above).
            if uv sync --frozen; then
              echo "ok" > .forge/bootstrap
            else
              echo "failed" > .forge/bootstrap
              echo "FORGE_BOOTSTRAP_FAILED: uv sync --frozen could not materialize the locked environment (infrastructure/config, never code repair)"
              pip install ${RUFF_VER:+ruff==${RUFF_VER}} ${PYTEST_VER:+pytest==${PYTEST_VER}} || true
            fi
          else
            echo "ok" > .forge/bootstrap
            pip install ${RUFF_VER:+ruff==${RUFF_VER}} || pip install "ruff>=0.4" || true
            pip install ${PYTEST_VER:+pytest==${PYTEST_VER}} || pip install pytest || true
          fi
          if echo "$FORGE_HARNESS_MCP" | grep -q codegraph; then
            npm install -g --no-fund --no-audit @colbymchenry/codegraph@1.6.0
            codegraph telemetry off
            timeout 300 codegraph init
          fi
          python -m forge.harness_entry --render-brief

      - name: Run harness driver
        env:
          FORGE_DRIVER: ${{ inputs.driver }}
          FORGE_MODEL: ${{ inputs.model }}
          FORGE_BRIEF: .forge/brief.md
          FORGE_EXIT_FILE: .forge/exit
          # Non-empty on a repair re-dispatch: the driver then caps the
          # model's per-turn thinking budget (guided fix — wall time is
          # dominated by long thinking turns).
          FORGE_REPAIR_CONTEXT: ${{ inputs.repair_context }}
          # R15 minimal lane credentials: ONLY the selected driver's secrets
          # render (the others resolve to '' — a driver never sees another
          # provider's key; provider-native subscriptions are not
          # interchangeable API keys, so each driver carries exactly the
          # credential its unattended contract consumes. BYOK swaps are a
          # configuration decision, never detected or enforced here).
          #   claude-code: ANTHROPIC_* (+ ZAI_API_KEY via the
          #     Anthropic-compatible coding endpoint)
          #   claude-sdk-lane: the same ANTHROPIC_* gateway recipe (EXE-02)
          #   grok-build: FORGE_GROK_AUTH (full ~/.grok/auth.json contents)
          #   opencode: ZAI_API_KEY
          #   copilot: COPILOT_GITHUB_TOKEN
          ANTHROPIC_API_KEY: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_AUTH_TOKEN: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_AUTH_TOKEN || '' }}
          ANTHROPIC_BASE_URL: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_BASE_URL || '' }}
          ZAI_API_KEY: ${{ inputs.driver == 'opencode' && secrets.ZAI_API_KEY || '' }}
          FORGE_GROK_AUTH: ${{ inputs.driver == 'grok-build' && secrets.FORGE_GROK_AUTH || '' }}
          COPILOT_GITHUB_TOKEN: ${{ inputs.driver == 'copilot' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          # R15: per-driver CLI version pins (JSON object driver → version;
          # "latest" = unpinned). A repo VARIABLE like FORGE_HARNESS_MCP —
          # unset falls back to forge's known-good defaults.
          FORGE_DRIVER_VERSIONS: ${{ vars.FORGE_DRIVER_VERSIONS }}
          # MCP (ADR-0022): canonical mcpServers JSON from a repo VARIABLE
          # (not secret — it references secrets by ${VAR} name); an empty
          # value means strict isolation with no servers.
          FORGE_HARNESS_MCP: ${{ vars.FORGE_HARNESS_MCP }}
        run: |
          # Driver provisioning + invocation is rendered by forge's
          # HarnessDriver (claude-code | grok-build | opencode | copilot):
          #   - installs the pinned CLI (retry, platform binary check)
          #   - runs the agent unattended; the -p prompt is the SHORT
          #     pointer at .forge/brief.md (the shared brief IS the prompt)
          #   - streams normalized events into the job log
          #   - writes .forge/exit (completed|failed) — file presence is
          #     decoupled from agent exit status
          python -m forge.harness_entry

      - name: Emit candidate artifact
        if: always()
        run: |
          # Belt and braces for the local exclude: lane infrastructure is
          # never a deliverable.
          rm -rf .codegraph .venv
          rm -rf __pycache__ .pytest_cache
          find . -name '*.pyc' -delete 2>/dev/null || true
          git add -A
          # R16/A08: stage the candidate in a directory whose name carries
          # NO leading dot. upload-artifact@v4 (>= 4.4.0) excludes hidden
          # files by default AND its globber drops dot-directories before
          # traversal — a leading-dot staging name uploads NOTHING on a
          # fresh repo (if-no-files-found: error fired every run). Only the
          # two contract files are ever staged here; nothing else can ride
          # along, so include-hidden-files stays unnecessary.
          rm -rf forge-output && mkdir -p forge-output
          git diff --cached --binary --full-index "${{ inputs.attempt_base_oid }}" \
            > forge-output/candidate.diff || true
          # Meta schema v2 (schema_version, run + GitHub attempt identity,
          # sha256 digest binding the meta to the exact diff bytes, usage
          # receipt; A18 adds the additive `bootstrap` classification and
          # the executed execution-profile `profile_digest` fields) is
          # built by the same pinned
          # forge the lane runs — one schema, one test suite, never a
          # heredoc copy of it. The .forge/usage.json receipt rides INSIDE
          # the meta so usage reaches the control plane with the candidate
          # (R23).
          python -m forge.harness_entry --emit-meta \
            --forge-run-id "${{ inputs.run_id }}" \
            --attempt-base-oid "${{ inputs.attempt_base_oid }}" \
            --driver "${{ inputs.driver }}" \
            --model "${{ inputs.model }}"

      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-candidate-${{ inputs.run_id }}
          # The staged non-hidden directory (R16/A08): its two files land
          # in the zip under their basenames (the v4 least-common-ancestor
          # rule) — the exact layout the control plane's basename matcher
          # consumes. The name MUST NOT start with a dot (A08): the v4
          # globber drops dot-directories before traversal.
          path: forge-output
          if-no-files-found: error
          retention-days: 7

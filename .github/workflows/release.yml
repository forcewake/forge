name: release

on:
  push:
    tags: ["v*", "!v*-rc.*"]

# Releases share the dedicated smoke runner and its public ingress.
concurrency:
  group: forge-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  candidate:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      FORGE_PG_TEST_URL: postgresql+asyncpg://forge:forge@127.0.0.1:5432/forge
      GH_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      rc: ${{ steps.identity.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate the version before building
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          uv run --no-project --python 3.13 python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'a stable version tag is required'
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert tag == 'v' + version
          assert f'__version__ = "{version}"' in pathlib.Path('src/forge/__init__.py').read_text()
          PY
      - name: Build and qualify the immutable release bundle once
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python -m tools.release.bundle --repo "$GITHUB_REPOSITORY" --rc "${GITHUB_REF_NAME}-rc.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --output "$RUNNER_TEMP/release-bundle"
          cp -R "$RUNNER_TEMP/release-bundle/dist" dist
          cp "$RUNNER_TEMP/release-bundle/local-bundle.json" local-bundle.json
          uv export --frozen --all-packages --all-extras --no-emit-package forge --no-emit-package forge-protocol --no-emit-package forge-lane --output-file "$RUNNER_TEMP/test-requirements.txt"
      - name: Test installed wheels in a fresh environment
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/release-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --require-hashes -r "$RUNNER_TEMP/test-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -I -c 'import forge; assert "site-packages" in forge.__file__, forge.__file__'
          "$RUNNER_TEMP/release-venv/bin/python" -m pytest -q -m "not slow" --junitxml=default.xml
          "$RUNNER_TEMP/release-venv/bin/python" -m pytest -q $("$RUNNER_TEMP/release-venv/bin/python" tests/invariants/registry.py) --junitxml=invariants.xml
          "$RUNNER_TEMP/release-venv/bin/python" scripts/assert_no_skips.py invariants.xml
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate the package registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the image from the tested wheels once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.release
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
      - name: Bind all artifact identities
        id: identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          rc="${GITHUB_REF_NAME}-rc.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          python3 tools/release/artifacts.py prepare --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --rc "$rc" --commit "$GITHUB_SHA" --image "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Boot the exact registry image with explicit schema installation
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: >-
          python3 tools/canary_smoke.py "$IMAGE" --runtime docker
          --expected-version "${GITHUB_REF_NAME#v}"
          --stages fresh --results-json canary-results.json
      - name: Stage immutable RC assets
        env:
          RC: ${{ steps.identity.outputs.rc }}
        run: |
          gh release create "$RC" --target "$GITHUB_SHA" --prerelease --title "forge ${GITHUB_REF_NAME#v} candidate" --notes "Unpromoted candidate. No final image tag has moved."
          gh release upload "$RC" dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate
          path: |
            dist
            default.xml
            invariants.xml
            canary-results.json
            local-bundle.json
          if-no-files-found: error

  live-smoke:
    needs: candidate
    # Provisioned sandbox runner: Docker, real provider/LLM credentials and a
    # public HTTPS endpoint forwarded to this runner's port 8420. Never lab DBs.
    runs-on: [self-hosted, linux, x64, forge-release-sandbox]
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider: [github, gitlab]
    env:
      IMAGE: ${{ needs.candidate.outputs.image }}
      PROVIDER: ${{ matrix.provider }}
      SMOKE_ENV: ${{ secrets.FORGE_RELEASE_SMOKE_ENV }}
      ACTOR_TOKEN: ${{ matrix.provider == 'github' && secrets.FORGE_RELEASE_GITHUB_ACTOR_TOKEN || secrets.FORGE_RELEASE_GITLAB_ACTOR_TOKEN }}
      REGISTRY_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
      TARGET: ${{ matrix.provider == 'github' && vars.FORGE_RELEASE_GITHUB_SANDBOX || vars.FORGE_RELEASE_GITLAB_SANDBOX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Boot the RC digest with private 1.0 configuration and a fresh database
        run: |
          set -euo pipefail
          test -n "$SMOKE_ENV" && test -n "$ACTOR_TOKEN" && test -n "$TARGET"
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/release-docker-$PROVIDER"
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scope="forge-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROVIDER}"
          private="$RUNNER_TEMP/$scope-private"
          echo "SCOPE=$scope" >> "$GITHUB_ENV"
          echo "PRIVATE=$private" >> "$GITHUB_ENV"
          python3 - <<'PYCONFIG'
          import json, os, pathlib
          bundles = json.loads(os.environ['SMOKE_ENV'])
          if set(bundles) != {'github', 'gitlab'}:
              raise ValueError('provide explicit closed sandbox bundles for both native providers')
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'forge-release-bundle.json')
          path.write_text(json.dumps(bundles[os.environ['PROVIDER']]))
          PYCONFIG
          python3 -m tools.release.containers prepare --bundle "$RUNNER_TEMP/forge-release-bundle.json" --manifest dist/release-manifest.json --output "$private" --provider "$PROVIDER" --repository "$TARGET" --scope "$scope"
          docker network create "$scope"
          docker run -d --name "$scope-pg" --network "$scope" -e POSTGRES_USER=forge -e POSTGRES_PASSWORD=forge -e POSTGRES_DB=forge postgres:17-alpine
          for i in $(seq 1 60); do docker exec "$scope-pg" pg_isready -U forge -d forge && break; sleep 1; done
          docker exec "$scope-pg" pg_isready -U forge -d forge
          for role in install app worker; do
            python3 -m tools.release.containers launch "$IMAGE" "$scope" "$private/control.json" "$role"
          done
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8420/healthz >/dev/null && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:8420/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:8420/readyz >/dev/null
      - name: Require actual native happy and code-failure repair acceptance
        run: |
          set -euo pipefail
          docker exec "$SCOPE-app" mkdir -p /tmp/forge-release-tools/tools
          docker cp tools/release "$SCOPE-app:/tmp/forge-release-tools/tools/release"
          docker cp dist "$SCOPE-app:/tmp/release-artifacts"
          export FORGE_RELEASE_SMOKE_ACTOR_TOKEN="$ACTOR_TOKEN"
          result=0
          docker exec --env FORGE_RELEASE_SMOKE_ACTOR_TOKEN --env FORGE_RELEASE_SANDBOX=1 --env PYTHONPATH=/tmp/forge-release-tools "$SCOPE-app" python -m tools.release.live_smoke "$PROVIDER" --repository "$TARGET" --manifest /tmp/release-artifacts/release-manifest.json --artifacts /tmp/release-artifacts --out /tmp/provider-smoke.json || result=$?
          docker cp "$SCOPE-app:/tmp/provider-smoke.json" "$PROVIDER-smoke.json"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.provider }}
          path: ${{ matrix.provider }}-smoke.json
          if-no-files-found: error
      - name: Remove only this job's disposable services and private inputs
        if: always()
        run: |
          if [ -n "${SCOPE:-}" ]; then
            docker rm -f "$SCOPE-worker" "$SCOPE-app" "$SCOPE-pg" || true
            docker network rm "$SCOPE" || true
          fi
          if [ -n "${PRIVATE:-}" ]; then rm -rf "$PRIVATE"; fi
          rm -f "$RUNNER_TEMP/forge-release-bundle.json"
          rm -rf "$RUNNER_TEMP/release-docker-$PROVIDER"

  promote:
    needs: [candidate, live-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.candidate.outputs.image }}
      RC: ${{ needs.candidate.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: live-*
          merge-multiple: true
      - name: Verify staged RC bytes and bind the report
        run: |
          set -euo pipefail
          gh release download "$RC" --dir "$RUNNER_TEMP/rc"
          python3 tools/release/artifacts.py verify --dist "$RUNNER_TEMP/rc"
          cmp dist/release-manifest.json "$RUNNER_TEMP/rc/release-manifest.json"
      - name: Authenticate the registry for SBOM generation
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
      - name: Bind the signed report to the SBOM and all prior proofs
        run: python3 tools/release/artifacts.py report
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the tested image and release report before promotion
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$IMAGE"
          cosign sign-blob --yes --bundle release-report.sigstore.json release-report.json
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: docker/setup-buildx-action@v3
      - name: Publish the same distributions and attach tags to the tested digest
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "forge ${GITHUB_REF_NAME#v}" --notes "Built once; installed-wheel tests, zero-skip invariants, image boot and both live provider smokes passed. See the signed release report."
          gh release upload "$GITHUB_REF_NAME" dist/* release-report.json release-report.sigstore.json sbom.spdx.json
          docker buildx imagetools create -t "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" "$IMAGE"
          gh release edit "$GITHUB_REF_NAME" --draft=false

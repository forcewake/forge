[project]
name = "forge"
version = "0.42.0"
description = "Agentic software factory for GitLab CE, GitHub, and Azure DevOps — issue to reviewed Draft MR/PR; the bot never merges"
requires-python = ">=3.13"
license = "BSD-3-Clause"

dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "aiosqlite==0.22.1",
    "agno[litellm]==2.5.0",
    "tiktoken==0.12.0",
    "redis==7.4.0",
    "litellm<=1.82.0",
    "mcp==1.26.0",
    # GitHub App auth (ADR-0019 slice): JWT minting + RS256 signing.
    # pyjwt already arrives transitively (agno/litellm), so this direct
    # dependency is trivially safe — forge.integrations.github imports it.
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-httpx==0.36.0",
    "fakeredis>=2.26",
    "ruff==0.15.7",
    "mypy==1.19.1",
    # Stubs for the `yaml` import in forge.config — keeps mypy clean without
    # per-module ignore comments (blocking typecheck, F29).
    "types-PyYAML>=6.0.12",
    "import-linter==2.15",
    "pytest-cov==7.1.0",
    "diff-cover==10.6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
mysql = ["aiomysql==0.3.2"]
# GitHub source adapter (ADR-0019): RS256 JWT signing needs the crypto extra.
github = ["pyjwt[crypto]>=2.10", "cryptography>=42"]
# Real interactive-driver clients (forge.adaptive.drivers). Only the Claude
# lane needs a vendor package — >=0.2.118 is the first release whose aborted
# turns emit ResultMessage.terminal_reason (interrupt-keyed completion, see
# docs/research/2026-09-21-claude-sdk-python.md §7.2). Codex rides stdlib asyncio;
# OpenCode rides the httpx core dependency.
interactive = ["claude-agent-sdk>=0.2.118"]

# R38-17 (issue #318 / ADR-0032 §5): the console entry-points the
# v0.37.0 wheel owed — the module mains existed, the wheel never
# exposed them. `forge-doctor` is the machine-checkable environment
# verification; `forge` is a thin dispatcher onto the same mains (no
# new logic, no shadowed flags — each subcommand's argparse keeps
# owning its own surface).
[project.scripts]
forge = "forge.cli:main"
forge-doctor = "forge.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]
# Package data (script-rendering architecture): the lane driver-script
# templates (harnesses/scripts/**/*.sh) and the harness log filter
# (harnesses/scripts/harness-log-filter.mjs) are non-Python files INSIDE
# the package tree — they ride the wheel as package data and are read at
# render time via importlib.resources (never fetched over the network at
# lane time). The explicit include documents that intent: executable lane
# assets ship with the code they belong to.
include = ["src/forge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Q35-09: the production-entry invariant traces (issue #246) — the thin
# layer that drives the SAME entry points a customer invokes (real lane
# and collector subprocesses, real HTTP provider writes against the fake
# native server, real durable state). Registered so the layer is
# selectable with `-m production_entry` without a pytest warning.
markers = [
    "production_entry: Q35-09 production-entry invariant traces (AT-01..AT-06 at the process/DB level)",
    "slow: spawns real processes or services; the default CI job runs -m 'not slow'",
    "invariant: evidence for the non-negotiable invariants I1-I8 (DESIGN §4); run with -m invariant",
]
# B14: the suite runs warning-clean except ONE known upstream artifact —
# aiosqlite's worker thread finalizes its anyio memory stream after the
# event loop closed (ResourceWarning from anyio/streams/memory.__del__).
# The engines are disposed correctly (fixtures call engine.dispose()); the
# stream belongs to aiosqlite's own thread teardown. Everything else stays
# visible — no blanket ignores.
filterwarnings = [
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]
testpaths = ["tests"]

# ADR-0035 guardrail: mechanical import boundaries. The ignore lists record
# existing debt and may only shrink (ROADMAP P0-07;
# tests/test_import_contract_debt.py counts them).
[tool.importlinter]
root_package = "forge"

[[tool.importlinter.contracts]]
name = "durable does not import runs, adaptive, gateway or integrations"
type = "forbidden"
source_modules = ["forge.durable"]
forbidden_modules = ["forge.runs", "forge.adaptive", "forge.gateway", "forge.integrations"]
# Lazy imports inside durable/budgets.py functions. Each entry covers every
# import between the two modules, and importing forge.runs.candidate loads
# forge.runs (RunService) at runtime.
ignore_imports = [
    "forge.durable.budgets -> forge.adaptive.usage_ingestion",
    "forge.durable.budgets -> forge.runs.candidate",
]

[[tool.importlinter.contracts]]
name = "harnesses do not import forge.runs"
type = "forbidden"
source_modules = ["forge.harnesses"]
# The whole package: forge/runs/__init__.py loads RunService, which imports
# forge.harnesses, so any runs import from here would create a cycle.
forbidden_modules = ["forge.runs"]

[[tool.importlinter.contracts]]
id = "authority-repository_identity_checkpoint_lifecycle"
name = "repository_identity_checkpoint_lifecycle: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.checkpoint_repository", "forge.api_checkpoint_channel"]
allowed_importers = ["forge.adaptive.checkpoint_migration", "forge.adaptive.checkpoint_repository", "forge.adaptive.compat_fixtures", "forge.adaptive.continuation", "forge.adaptive.operator_snapshot", "forge.adaptive.ops_drills", "forge.adaptive.revisions", "forge.adaptive.wiring", "forge.api_checkpoint_channel", "forge.main", "forge.runs.github_service", "forge.runs.revival", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-continuation_authorization"
name = "continuation_authorization: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.continuation"]
allowed_importers = ["forge.adaptive.compat_fixtures", "forge.adaptive.continuation", "forge.runs.github_service", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-native_occupancy"
name = "native_occupancy: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.admission", "forge.runs.admission"]
allowed_importers = ["forge.adaptive.admission", "forge.adaptive.command_router", "forge.adaptive.operator_snapshot", "forge.adaptive.ops_drills", "forge.api_operator", "forge.runs", "forge.runs.admission", "forge.runs.azure_service", "forge.runs.github_service", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-verification_applicability"
name = "verification_applicability: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.verification_binding", "forge.adaptive.verification_sets", "forge.runs.usecases"]
allowed_importers = ["forge.adaptive.independent_checks", "forge.adaptive.reference.system_twin", "forge.adaptive.system_verification", "forge.adaptive.verification_binding", "forge.adaptive.verification_executor", "forge.adaptive.verification_sets", "forge.adaptive.workpackage", "forge.runs.azure_service", "forge.runs.github_service", "forge.runs.usecases"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-operator_projection"
name = "operator_projection: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.operator_view", "forge.adaptive.operator_snapshot"]
allowed_importers = ["forge.adaptive.credential_broker", "forge.adaptive.credential_preflight", "forge.adaptive.operator_snapshot", "forge.adaptive.operator_view", "forge.adaptive.ops_limits", "forge.adaptive.project_credentials", "forge.adaptive.support_bundle", "forge.api_operator", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-execution_delivery_spec"
name = "execution_delivery_spec: registered direct importers only"
type = "protected"
protected_modules = ["forge.adaptive.execution_spec"]
allowed_importers = ["forge.adaptive.execution_spec"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-budget_amendment_application"
name = "budget_amendment_application: registered direct importers only"
type = "protected"
protected_modules = ["forge.durable.budgets"]
allowed_importers = ["forge.adaptive.closing_budget", "forge.durable", "forge.durable.budgets", "forge.factory.llm", "forge.runs.revival", "forge.runs.round_admission", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-feedback_admission"
name = "feedback_admission: registered direct importers only"
type = "protected"
protected_modules = ["forge.gateway.feedback"]
allowed_importers = ["forge.doctor", "forge.gateway.feedback", "forge.gateway.router", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-command_acceptance_dedup"
name = "command_acceptance_dedup: registered direct importers only"
type = "protected"
protected_modules = ["forge.gateway.durable_ingress"]
allowed_importers = ["forge.gateway.azure_webhook", "forge.gateway.durable_ingress", "forge.gateway.github_webhook", "forge.gateway.router"]
as_packages = false

[[tool.importlinter.contracts]]
id = "authority-review_round_admission"
name = "review_round_admission: registered direct importers only"
type = "protected"
protected_modules = ["forge.runs.round_admission"]
allowed_importers = ["forge.runs.round_admission", "forge.runs.service"]
as_packages = false

[[tool.importlinter.contracts]]
id = "usecases-provider-neutral"
name = "usecases have no direct provider or gateway imports"
type = "forbidden"
source_modules = ["forge.runs.usecases"]
forbidden_modules = ["forge.integrations", "forge.gateway"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "reference-importers"
name = "reference package has only registered compatibility importers"
type = "protected"
protected_modules = ["forge.adaptive.reference"]
allowed_importers = ["forge.adaptive.system_verification", "forge.adaptive.steering_causality"]

[[tool.importlinter.contracts]]
id = "reference-direction"
name = "reference package does not import production entry points"
type = "forbidden"
source_modules = ["forge.adaptive.reference"]
forbidden_modules = ["forge.main", "forge.lane_driver", "forge.adaptive.wiring", "forge.runs.service", "forge.runs.github_service", "forge.runs.azure_service"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "fixture-isolation"
name = "production modules do not import qualification fixtures"
type = "protected"
protected_modules = ["forge.adaptive.compat_fixtures"]
allowed_importers = []
as_packages = false

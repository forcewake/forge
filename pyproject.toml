[project]
name = "forge"
version = "0.28.0"
description = "Agentic software factory for GitLab CE, GitHub, and Azure DevOps — issue to reviewed Draft MR/PR; the bot never merges"
requires-python = ">=3.13"
license = "BSD-3-Clause"

dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "aiosqlite==0.22.1",
    "agno[litellm]==2.5.0",
    "tiktoken==0.12.0",
    "redis==7.4.0",
    "litellm<=1.82.0",
    "mcp==1.26.0",
    # GitHub App auth (ADR-0019 slice): JWT minting + RS256 signing.
    # pyjwt already arrives transitively (agno/litellm), so this direct
    # dependency is trivially safe — forge.integrations.github imports it.
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-httpx==0.36.0",
    "fakeredis>=2.26",
    "ruff==0.15.7",
    "mypy==1.19.1",
    # Stubs for the `yaml` import in forge.config — keeps mypy clean without
    # per-module ignore comments (blocking typecheck, F29).
    "types-PyYAML>=6.0.12",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
mysql = ["aiomysql==0.3.2"]
# GitHub source adapter (ADR-0019): RS256 JWT signing needs the crypto extra.
github = ["pyjwt[crypto]>=2.10", "cryptography>=42"]
# Real interactive-driver clients (forge.adaptive.drivers). Only the Claude
# lane needs a vendor package — >=0.2.118 is the first release whose aborted
# turns emit ResultMessage.terminal_reason (interrupt-keyed completion, see
# docs/research/2026-09-21-claude-sdk-python.md §7.2). Codex rides stdlib asyncio;
# OpenCode rides the httpx core dependency.
interactive = ["claude-agent-sdk>=0.2.118"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]
# Package data (script-rendering architecture): the lane driver-script
# templates (harnesses/scripts/**/*.sh) and the harness log filter
# (harnesses/scripts/harness-log-filter.mjs) are non-Python files INSIDE
# the package tree — they ride the wheel as package data and are read at
# render time via importlib.resources (never fetched over the network at
# lane time). The explicit include documents that intent: executable lane
# assets ship with the code they belong to.
include = ["src/forge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# B14: the suite runs warning-clean except ONE known upstream artifact —
# aiosqlite's worker thread finalizes its anyio memory stream after the
# event loop closed (ResourceWarning from anyio/streams/memory.__del__).
# The engines are disposed correctly (fixtures call engine.dispose()); the
# stream belongs to aiosqlite's own thread teardown. Everything else stays
# visible — no blanket ignores.
filterwarnings = [
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]
testpaths = ["tests"]

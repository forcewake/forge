[project]
name = "forge"
version = "1.0.0"
description = "Agentic software factory for GitLab CE and GitHub — issue to reviewed Draft MR/PR; the bot never merges"
requires-python = ">=3.13"
license = "BSD-3-Clause"

dependencies = [
    "forge-protocol>=0.1.0,<0.2.0",
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "httpx==0.28.1",
    "pydantic>=2.13.5,<3",
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "forge-lane[claude]>=0.1.0,<0.2.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-httpx==0.36.0",
    "fakeredis>=2.26",
    "ruff==0.15.7",
    "mypy==1.19.1",
    # Workflow/template inspection is development tooling, outside the server.
    "pyyaml==6.0.3",
    "types-PyYAML>=6.0.12",
    "import-linter==2.15",
    "pytest-cov==7.1.0",
    "diff-cover==10.6.0",
    "deptry==0.25.1",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
sqlite = ["aiosqlite==0.22.1"]

[project.scripts]
forge = "forge.runtime.cli:main"
forge-schema = "forge.store.schema.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Q35-09: the production-entry invariant traces (issue #246) — the thin
# layer that drives the SAME entry points a customer invokes (real lane
# and collector subprocesses, real HTTP provider writes against the fake
# native server, real durable state). Registered so the layer is
# selectable with `-m production_entry` without a pytest warning.
markers = [
    "production_entry: Q35-09 production-entry invariant traces (AT-01..AT-06 at the process/DB level)",
    "slow: spawns real processes or services; the default CI job runs -m 'not slow'",
    "invariant: evidence for the non-negotiable invariants I1-I8 (DESIGN §4); run with -m invariant",
]
# B14: the suite runs warning-clean except ONE known upstream artifact —
# aiosqlite's worker thread finalizes its anyio memory stream after the
# event loop closed (ResourceWarning from anyio/streams/memory.__del__).
# The engines are disposed correctly (fixtures call engine.dispose()); the
# stream belongs to aiosqlite's own thread teardown. Everything else stays
# visible — no blanket ignores.
filterwarnings = [
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]
testpaths = ["tests"]

[tool.uv.workspace]
exclude = ["tools"]
members = ["packages/forge-protocol", "packages/forge-lane"]

[tool.uv.sources]
forge-protocol = { workspace = true }
forge-lane = { workspace = true }

# Current production authority boundaries. No ignored imports or legacy modules.
[tool.importlinter]
root_packages = ["forge", "forge_protocol", "forge_lane"]
include_external_packages = true


[project]
name = "forge"
version = "0.2.0"
description = "Agentic software factory sidecar for GitLab CE"
requires-python = ">=3.13"
license = "BSD-3-Clause"

dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "aiosqlite==0.22.1",
    "agno[litellm]==2.5.0",
    "tiktoken==0.12.0",
    "redis==7.4.0",
    "litellm<=1.82.0",
    "mcp==1.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-httpx==0.36.0",
    "fakeredis>=2.26",
    "ruff==0.15.7",
    "mypy==1.19.1",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
mysql = ["aiomysql==0.3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

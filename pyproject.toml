[tool.deptry]
known_first_party = ["forge"]

# These modules are loaded by their owning libraries rather than imported by Forge.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "aiosqlite", # SQLAlchemy's default sqlite+aiosqlite URL.
    "asyncpg", # SQLAlchemy's postgres extra URL.
    "uvicorn", # The production Docker command invokes its console entry point.
]

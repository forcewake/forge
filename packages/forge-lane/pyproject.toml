[project]
name = "forge-lane"
version = "0.1.0"
description = "CI execution lane, independent of the Forge control plane."
requires-python = ">=3.13"
license = "BSD-3-Clause"
dependencies = ["forge-protocol>=0.1.0,<0.2.0", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_lane"]

[tool.uv.sources]
forge-protocol = { workspace = true }

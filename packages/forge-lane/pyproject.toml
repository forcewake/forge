[project]
name = "forge-lane"
version = "0.1.0"
description = "CI execution lane, independent of the Forge control plane."
requires-python = ">=3.13"
license = "BSD-3-Clause"
dependencies = ["forge-protocol>=0.1.0,<0.2.0", "httpx==0.28.1", "pydantic>=2.13.5,<3"]

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.157"]

[project.scripts]
forge-lane = "forge_lane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_lane"]

[tool.uv.sources]
forge-protocol = { workspace = true }

[tool.deptry]
known_first_party = ["forge_lane"]

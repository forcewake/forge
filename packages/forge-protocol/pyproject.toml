[project]
name = "forge-protocol"
version = "0.1.0"
description = "Versioned wire contracts shared by the server and CI lane."
requires-python = ">=3.13"
license = "BSD-3-Clause"
dependencies = ["pydantic>=2.13.5,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_protocol"]

[tool.deptry]
known_first_party = ["forge_protocol"]

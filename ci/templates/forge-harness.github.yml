# forge harness executor for GitHub Actions (ADR-0016/0019, Stage E3b)
#
# Human-applied to the TARGET repository at onboarding (mirrors the GitLab
# onboarding): this workflow is what forge dispatches when a run needs a
# coding agent. The agent runs in GitHub's ephemeral runner — the lane has
# NO write credentials and NO forge secrets; its only output is the
# candidate artifact, which the forge trusted publisher validates and
# publishes (create_commit_on_branch + Draft PR).
#
# Dispatched by forge via workflow_dispatch with inputs:
#   run_id, attempt_base_oid, driver, model, issue_number, plan_note_id,
#   envelope_digest, spec_digest, plan_digest, lane_resume_mode,
#   repair_context
#   (see forge.execution.github_actions; the approved plan/task bytes are
#   fetched by the lane from the plan comment addressed by plan_note_id and
#   re-verified against envelope_digest + spec_digest — A03: fail-closed on
#   any post-approval byte change; no input size limits; empty
#   envelope_digest = legacy replay, unenforced; plan_digest carries the
#   ACTIVE plan revision's digest when an approved revision was activated —
#   R32-11: the lane's brief binds to the durable active plan, never the
#   superseded comment)
#
# The driver step is rendered by forge's HarnessDriver.build_script()
# (Stage D) — the template only provisions the lane.

name: forge-harness

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "forge run id"
        required: true
        type: string
      attempt_base_oid:
        description: "frozen attempt base (detached checkout)"
        required: true
        type: string
      driver:
        description: "harness driver: claude-code | grok-build | opencode | copilot | claude-sdk-lane | codex-sdk-lane | opencode-sdk-lane | copilot-sdk-lane"
        required: true
        type: string
      model:
        description: "model route from the approved RunSpec"
        required: false
        default: ""
        type: string
      issue_number:
        description: "issue whose forge plan comment carries the approved plan"
        type: string
        required: true
      lane_control_token:
        description: "per-work HMAC lane-control token (dispatch-computed)"
        type: string
        required: false
        default: ""
      lane_resume_mode:
        description: >-
          WIP-continuity contract the dispatch selected: fresh (initial
          dispatch — nothing restores), required (retry/revival — the held
          checkpoint MUST restore or the lane halts), restart (explicit
          discard of held WIP). Mapped onto the driver step's
          FORGE_LANE_RESUME env.
        type: string
        required: false
        default: "fresh"
      plan_note_id:
        description: "issue comment id of the approved forge plan (empty = legacy scan)"
        required: false
        default: ""
        type: string
      envelope_digest:
        description: >-
          sha256 of the approved brief envelope (A03; the lane re-verifies the
          comment's approved bytes against it, fail-closed; empty = legacy replay)
        required: false
        default: ""
        type: string
      spec_digest:
        description: "digest of the frozen executable RunSpec the envelope binds (A03)"
        required: false
        default: ""
        type: string
      plan_digest:
        description: >-
          digest of the ACTIVE plan revision (R32-11): present only when an
          approved revision was activated — the lane's brief binds to this
          durable digest, never the superseded plan comment's.
        required: false
        default: ""
        type: string
      repair_context:
        description: "bounded verification-failure context (repair re-dispatch)"
        required: false
        default: ""
        type: string

concurrency:
  group: forge-${{ inputs.run_id }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    # Above the run-side FORGE_HARNESS_TIMEOUT_SECONDS (5400s) so the
    # harness deadline classifies honestly (harness_timeout) instead of
    # GitHub killing the job as 'cancelled' at 60m (LIVE-found).
    timeout-minutes: 120
    # READ-ONLY: the lane fetches the issue body + the forge plan comment
    # to render .forge/brief.md (forge.harness_entry --render-brief). No
    # write permission is granted — the candidate travels as an artifact.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout target at the frozen attempt base (detached)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.attempt_base_oid }}
          fetch-depth: 0
          # No credentials are configured for push; persist-credentials is
          # disabled so nothing actionable remains in .git/config.
          persist-credentials: false

      - name: Disable push (proposal-only lane, ADR-0016)
        run: git remote set-url --push origin FORBIDDEN

      - name: Forge control directory
        run: |
          mkdir -p .forge && echo ".forge/" >> .git/info/exclude 2>/dev/null || true
          # codegraph's SQLite graph DB must never reach the candidate diff
          # (same fail-closed publisher posture as .forge/).
          echo ".codegraph/" >> .git/info/exclude 2>/dev/null || true
          echo "__pycache__/" >> .git/info/exclude 2>/dev/null || true
          echo "*.pyc" >> .git/info/exclude 2>/dev/null || true
          # uv sync creates the workspace venv - lane infrastructure, never
          # a deliverable.
          echo ".venv/" >> .git/info/exclude 2>/dev/null || true
          # The emit step's staging directory is lane infrastructure too —
          # it must never leak into a git add (belt and braces: the emit
          # step stages it only AFTER its own git add -A).
          echo "forge-output/" >> .git/info/exclude 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The lane receives ONLY harness credentials, injected as secrets by
      # the repo owner (never forge's publisher token) — R15: gated per
      # driver in the step below, so a driver never sees another provider's
      # key (capability/credential pairs: provider-native subscriptions are
      # not interchangeable API keys):
      #   claude-code: ANTHROPIC_* / ZAI_API_KEY   opencode: ZAI_API_KEY
      #   grok-build: FORGE_GROK_AUTH              copilot: COPILOT_GITHUB_TOKEN
      # Set explicitly in repo Actions secrets.
      - name: Render the implementation brief
        env:
          # Read-only runner token: fetches the forge plan comment (the
          # APPROVED plan + task bytes) and renders .forge/brief.md via the
          # shared prompt builder. The live issue body is NOT read for the
          # task text on the enforced path (A03). Nothing is written to
          # the repository.
          GITHUB_TOKEN: ${{ github.token }}
          FORGE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          # R05: bind the brief to the EXACT approved plan comment — the
          # journaled id of the comment forge posted with the plan, fetched
          # by id and validated (author + "Forge plan" header + this run's
          # id) fail-closed. Empty on a legacy replay: the lane then falls
          # back to the heuristic scan, loudly unenforced.
          FORGE_PLAN_NOTE_ID: ${{ inputs.plan_note_id }}
          # A03: the approved BriefEnvelope — the lane extracts the approved
          # task/plan sections from that comment, re-computes this digest
          # over exactly those bytes and fails closed on mismatch
          # ("approved brief bytes changed after approval (re-approval
          # required)"). Both empty on a legacy replay: the lane then reads
          # the task text LIVE, loudly unenforced.
          FORGE_ENVELOPE_DIGEST: ${{ inputs.envelope_digest }}
          FORGE_SPEC_DIGEST: ${{ inputs.spec_digest }}
          # R32-11: the ACTIVE plan revision's digest when an approved
          # revision was activated — the durable plan identity this lane's
          # brief runs under (empty on the classic path: the envelope
          # binding above is the whole contract).
          FORGE_PLAN_DIGEST: ${{ inputs.plan_digest }}
          # The run id the plan comment must mention (tamper guard: another
          # run's plan can never ride this lane's brief).
          FORGE_RUN_ID: ${{ inputs.run_id }}
          # NXT-11: the lane attaches the steering session when enabled —
          # rides the workflow's env (a repo VARIABLE can override).
          FORGE_STEERING_ENABLED: ${{ vars.FORGE_STEERING_ENABLED || '' }}
          # The steering attach scopes to the work id — FORGE_WORK_ID,
          # falling back to the FORGE_RUN_ID already on this block.
          FORGE_WORK_ID: ${{ inputs.run_id }}
          FORGE_REPAIR_CONTEXT: ${{ inputs.repair_context }}
          # Same source the driver reads: when it carries the `codegraph`
          # server, the brief names its tools AND this step indexes the
          # repo for it (pinned; telemetry off; local exclude above).
          FORGE_HARNESS_MCP: ${{ vars.FORGE_HARNESS_MCP }}
          # The forge install ref. Q35-08: there is NO hardcoded fallback
          # ref — the default lane version is the GENERATED pin inside the
          # script below (the latest PROMOTED release, rendered from the
          # archived promotion record by scripts/generate_template_pins.py).
          # R36-07 route ladder (exactly one explicit source; a conflict
          # refuses in the script below before anything installs): dev
          # source flag > explicit wheel > explicit released ref >
          # generated default. Override per repo by setting the
          # FORGE_LANE_REF Actions variable to a released v<tag>; a
          # branch/SHA needs the dev override below.
          FORGE_LANE_REF: ${{ vars.FORGE_LANE_REF }}
          # Q35-08: the explicitly LESS-QUALIFIED development route (default
          # off). Any value except the off-spellings false/0 installs the
          # lane from FORGE_LANE_REF SOURCE (a branch or SHA — a moving
          # target no release qualified) instead of the promoted release;
          # the install identity records qualified=false for it.
          # Deliberate and labeled, never silent. R36-07: the flag
          # OUTRANKS the wheel pins — it selects its route even with the
          # generated promoted-wheel default present.
          FORGE_LANE_DEV_SOURCE_INSTALL: ${{ vars.FORGE_LANE_DEV_SOURCE_INSTALL }}
          # NEXT-17: the IMMUTABLE wheel pin (preferred over the git ref).
          # FORGE_LANE_WHEEL is a release-artifact URL and
          # FORGE_LANE_WHEEL_SHA256 its sha256 (BOTH are required
          # together); the install step downloads, hashes and REFUSES the
          # artifact unless the bytes reproduce the pin, then installs the
          # exact verified local path (R32-08), recording both halves to
          # .forge/lane_install.json for the provenance report's
          # expected-vs-installed hash reconciliation. R36-07: an
          # unset-or-empty pair no longer re-fills itself — the install
          # falls through to the dev flag, an explicit ref, or the
          # GENERATED promoted wheel pin in the script below (the
          # authoritative lane distribution recorded in the promotion
          # record); a set wheel beside a set ref or dev flag refuses.
          FORGE_LANE_WHEEL: ${{ vars.FORGE_LANE_WHEEL }}
          FORGE_LANE_WHEEL_SHA256: ${{ vars.FORGE_LANE_WHEEL_SHA256 }}
          # NEXT-17: the expected sha256 of the codegraph MCP lock the
          # install step materializes (empty = the lock is generated but
          # not yet pinned; npm ci still enforces the lock's own per-tarball
          # sha512 integrities).
          FORGE_MCP_LOCK_SHA256: ${{ vars.FORGE_MCP_LOCK_SHA256 }}
        run: |
          # A18 environment classification: a FAILED environment bootstrap
          # is lane INFRASTRUCTURE/CONFIG — the environment never matched
          # the approved execution profile — and is classified
          # infrastructure (blocked), never a code-repair candidate. The
          # classification is mechanical: this step writes
          # .forge/bootstrap (ok|failed) for the candidate meta and echoes
          # the FORGE_BOOTSTRAP_FAILED marker into the job log (the
          # control plane's log classifier carries it).
          mkdir -p .forge
          # Q35-08: the lane pin is GENERATED from the latest archived
          # promotion record (scripts/generate_template_pins.py) — the
          # promoted release IS the default lane version, and the promoted
          # wheel (when the record built one) IS the default install
          # artifact. The old hardcoded historical git-ref fallback is gone:
          # a template copy whose pin was stripped and whose FORGE_LANE_REF
          # variable is unset REFUSES below with the upgrade instruction,
          # before any model call — never a silent seven-versions-stale
          # lane.
          # forge-lane-pin generated by scripts/generate_template_pins.py -- begin
          FORGE_LANE_PROMOTED_VERSION="v0.35.0"
          FORGE_LANE_PROMOTED_WHEEL_URL="https://github.com/forcewake/forge/releases/download/v0.35.0/forge-0.35.0-py3-none-any.whl"
          FORGE_LANE_PROMOTED_WHEEL_SHA256="1e365612473426a2130000784a6cd8c707ffcedae7f8f6bcb34c3f75791700d9"
          # forge-lane-pin generated by scripts/generate_template_pins.py -- end
          # NEXT-17/R36-07: the lane's own code is an IMMUTABLE resource,
          # and the install route is EXPLICIT and reproducible. The fragment
          # resolves exactly ONE route FIRST — FORGE_INSTALL_MODE is one of
          # dev-source | explicit-wheel | explicit-tag | default-wheel |
          # default-tag — before any download or install runs. Ladder
          # (documented, conflict-rejecting): (1) the dev source flag
          # FORGE_LANE_DEV_SOURCE_INSTALL — any value except the explicit
          # off-spellings false/0 — requires FORGE_LANE_REF to name the
          # branch/SHA; (2) an explicit FORGE_LANE_WHEEL with its
          # FORGE_LANE_WHEEL_SHA256; (3) an explicit released v<tag> in
          # FORGE_LANE_REF; (4) the GENERATED promoted wheel pin — the
          # authoritative lane distribution (image-only archives fall back
          # to the generated promoted TAG). More than one explicit source
          # refuses below BEFORE any package executes: a declared override
          # is applied or rejected, never silently ignored (the pre-R36-07
          # fragment resolved the wheel URL first, so the always-non-empty
          # promoted pin hid every dev/ref override — review 16339c2 P05).
          # R36-07 empty-vs-unset: the runner exports every env key (an
          # unset Actions variable arrives SET-BUT-EMPTY), so an input is
          # EXPLICIT only when it is both set (${VAR+x}) and non-empty.
          # Set-but-empty selects no route, raises no conflict, and never
          # re-fills itself — the retired `:-` merge let an emptied
          # FORGE_LANE_WHEEL resurrect the promoted pin and shadow a dev
          # flag that WAS set.
          FORGE_DEV_SOURCE_REQUESTED=""
          if [ "${FORGE_LANE_DEV_SOURCE_INSTALL+x}" = x ] \
            && [ -n "$FORGE_LANE_DEV_SOURCE_INSTALL" ] \
            && [ "$FORGE_LANE_DEV_SOURCE_INSTALL" != "false" ] \
            && [ "$FORGE_LANE_DEV_SOURCE_INSTALL" != "0" ]; then
            FORGE_DEV_SOURCE_REQUESTED=1
          fi
          FORGE_WHEEL_EXPLICIT=""
          if [ "${FORGE_LANE_WHEEL+x}" = x ] && [ -n "$FORGE_LANE_WHEEL" ]; then
            FORGE_WHEEL_EXPLICIT=1
          fi
          FORGE_WHEEL_SHA_EXPLICIT=""
          if [ "${FORGE_LANE_WHEEL_SHA256+x}" = x ] && [ -n "$FORGE_LANE_WHEEL_SHA256" ]; then
            FORGE_WHEEL_SHA_EXPLICIT=1
          fi
          FORGE_REF_EXPLICIT=""
          if [ "${FORGE_LANE_REF+x}" = x ] && [ -n "$FORGE_LANE_REF" ]; then
            FORGE_REF_EXPLICIT=1
          fi
          # Exactly one route source may be explicit; conflicts are
          # actionable configuration errors BEFORE any download or install
          # (zero package execution, zero model calls — AT-08).
          if [ -n "$FORGE_DEV_SOURCE_REQUESTED" ] && [ -n "$FORGE_WHEEL_EXPLICIT" ]; then
            echo "failed" > .forge/bootstrap
            echo "FORGE_BOOTSTRAP_FAILED: contradictory lane install routes — FORGE_LANE_DEV_SOURCE_INSTALL='$FORGE_LANE_DEV_SOURCE_INSTALL' requests the dev source route while FORGE_LANE_WHEEL='$FORGE_LANE_WHEEL' requests an explicit wheel. Set exactly one: unset FORGE_LANE_WHEEL to keep the dev source install, or unset FORGE_LANE_DEV_SOURCE_INSTALL to keep the wheel routes (infrastructure/config, never code repair)"
            exit 1
          fi
          if [ -n "$FORGE_WHEEL_EXPLICIT" ] && [ -n "$FORGE_REF_EXPLICIT" ]; then
            echo "failed" > .forge/bootstrap
            echo "FORGE_BOOTSTRAP_FAILED: contradictory lane install routes — FORGE_LANE_WHEEL='$FORGE_LANE_WHEEL' requests an explicit wheel while FORGE_LANE_REF='$FORGE_LANE_REF' requests an explicit ref. Set exactly one: the wheel URL with its sha256, or the released v<tag> ref — a ref beside a wheel is never silently ignored (infrastructure/config, never code repair)"
            exit 1
          fi
          FORGE_INSTALL_MODE=""
          FORGE_WHEEL_URL=""
          FORGE_WHEEL_SHA=""
          FORGE_LANE_REF_RESOLVED=""
          FORGE_LANE_EXPECTED_VERSION=""
          if [ -n "$FORGE_DEV_SOURCE_REQUESTED" ]; then
            FORGE_INSTALL_MODE="dev-source"
          elif [ -n "$FORGE_WHEEL_EXPLICIT" ]; then
            if [ -z "$FORGE_WHEEL_SHA_EXPLICIT" ]; then
              echo "failed" > .forge/bootstrap
              echo "FORGE_BOOTSTRAP_FAILED: FORGE_LANE_WHEEL is set but FORGE_LANE_WHEEL_SHA256 is not — an explicit wheel pin requires its sha256 (64 hex); unset both to install the GENERATED promoted wheel instead (infrastructure/config, never code repair)"
              exit 1
            fi
            FORGE_INSTALL_MODE="explicit-wheel"
            FORGE_WHEEL_URL="$FORGE_LANE_WHEEL"
            FORGE_WHEEL_SHA="$FORGE_LANE_WHEEL_SHA256"
          elif [ -n "$FORGE_REF_EXPLICIT" ]; then
            FORGE_INSTALL_MODE="explicit-tag"
            FORGE_LANE_REF_RESOLVED="$FORGE_LANE_REF"
          elif [ -n "$FORGE_LANE_PROMOTED_WHEEL_URL" ]; then
            FORGE_INSTALL_MODE="default-wheel"
            FORGE_WHEEL_URL="$FORGE_LANE_PROMOTED_WHEEL_URL"
            FORGE_WHEEL_SHA="$FORGE_LANE_PROMOTED_WHEEL_SHA256"
          else
            # Image-only archive (the promoted record built no wheel): the
            # qualified default is the generated promoted TAG — the
            # preserved pre-wheel fallback.
            FORGE_INSTALL_MODE="default-tag"
            FORGE_LANE_REF_RESOLVED="$FORGE_LANE_PROMOTED_VERSION"
          fi
          case "$FORGE_INSTALL_MODE" in
            dev-source)
              # Q35-08: the explicitly LESS-QUALIFIED development route —
              # source install from FORGE_LANE_REF (a branch or SHA; no
              # default, an unset ref refuses). The emitted identity
              # records qualified=false; never a production lane.
              if [ -z "$FORGE_LANE_REF" ]; then
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the dev source route (FORGE_LANE_DEV_SOURCE_INSTALL='$FORGE_LANE_DEV_SOURCE_INSTALL') requires FORGE_LANE_REF to name the source ref — unset is a refusal, never a fallback (infrastructure/config, never code repair)"
                exit 1
              fi
              pip install "forge @ git+https://github.com/forcewake/forge@${FORGE_LANE_REF}" || {
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the pinned forge lane code failed to install (missing tool - infrastructure/config, never code repair)"
                exit 1
              }
              printf '{"pin":"git-ref-dev","route":"dev-source","ref":"%s","qualified":false}\n' \
                "$FORGE_LANE_REF" > .forge/lane_install.json
              ;;
            explicit-wheel|default-wheel)
              # NEXT-17: the content-hash-pinned wheel (the --hash=sha256:
              # equivalent for a direct artifact URL): download, hash,
              # refuse on any mismatch, then install the verified bytes.
              if ! printf '%s' "$FORGE_WHEEL_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: FORGE_LANE_WHEEL_SHA256 must be a 64-hex sha256 when FORGE_LANE_WHEEL is set — and the GENERATED promoted wheel pin must carry its own sha256 on the default route (got: '$FORGE_WHEEL_SHA') (infrastructure/config, never code repair)"
                exit 1
              fi
              pip download --no-deps -d .forge/wheel "$FORGE_WHEEL_URL" || {
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the hash-pinned forge wheel could not be downloaded (missing tool - infrastructure/config, never code repair)"
                exit 1
              }
              # R32-08: the trusted lane-code route accepts EXACTLY ONE wheel.
              # A source archive (its build metadata executes at install,
              # before any hash-policy decision) or multiple candidates is a
              # deterministic refusal — never a guessed pick.
              set -- .forge/wheel/*.whl
              if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the pinned forge lane artifact must be exactly one wheel (got: $*) — source archives and ambiguous candidates are refused before execution (infrastructure/config, never code repair)"
                exit 1
              fi
              WHEEL_FILE="$1"
              ACTUAL_SHA="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$WHEEL_FILE")"
              if [ "$ACTUAL_SHA" != "$FORGE_WHEEL_SHA" ]; then
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: forge wheel hash mismatch — the route pinned sha256:$FORGE_WHEEL_SHA but the artifact hashes to sha256:$ACTUAL_SHA (infrastructure/config, never code repair)"
                exit 1
              fi
              # R32-08 (review probe P06, proven with real pip): a fragment
              # appended to a PLAIN local path is not a requirement — pip
              # parses "path#sha256=..." as an invalid dependency specifier
              # and the bootstrap died before installing anything. The digest
              # was verified above, so install the exact verified local path
              # and let pip resolve forge's runtime dependencies normally: the
              # CODE is the verified bytes, and --no-deps would strand the
              # lane without its imports.
              pip install "$WHEEL_FILE" || {
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the pinned forge lane code failed to install (missing tool - infrastructure/config, never code repair)"
                exit 1
              }
              # Q35-08: the expected lane version rides the wheel's own
              # filename (forge-<version>-*.whl); a wheel that does not name
              # a forge version simply records none (no strict gate).
              WHEEL_VERSION="$(printf '%s' "$(basename "$WHEEL_FILE")" | sed -n 's/^forge-\([0-9][^-]*\)-.*/\1/p')"
              printf '{"pin":"wheel","route":"%s","expected_sha256":"%s","actual_sha256":"%s","qualified":true,"version":"%s"}\n' \
                "$FORGE_INSTALL_MODE" "$FORGE_WHEEL_SHA" "$ACTUAL_SHA" "$WHEEL_VERSION" > .forge/lane_install.json
              FORGE_LANE_EXPECTED_VERSION="$WHEEL_VERSION"
              ;;
            explicit-tag|default-tag)
              if [ -z "$FORGE_LANE_REF_RESOLVED" ]; then
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: no lane version pinned — this template copy carries no generated lane pin and the FORGE_LANE_REF Actions variable is unset. Upgrade the lane: regenerate the template with 'python3 scripts/generate_template_pins.py' from the latest promoted record (docs/releases/evidence/), or set FORGE_LANE_REF to a released forge tag. The lane refuses to guess a version (infrastructure/config, never code repair)"
                exit 1
              fi
              case "$FORGE_LANE_REF_RESOLVED" in
                v[0-9]*.[0-9]*.[0-9]*)
                  ;;
                *)
                  echo "failed" > .forge/bootstrap
                  echo "FORGE_BOOTSTRAP_FAILED: FORGE_LANE_REF='$FORGE_LANE_REF_RESOLVED' is not a released version tag — a qualified lane installs released tags only. Source installs are the less-qualified development route: set FORGE_LANE_DEV_SOURCE_INSTALL=true (recorded as an unqualified dev override) or point FORGE_LANE_REF at a released v<tag> (infrastructure/config, never code repair)"
                  exit 1
                  ;;
              esac
              pip install "forge @ git+https://github.com/forcewake/forge@${FORGE_LANE_REF_RESOLVED}" || {
                echo "failed" > .forge/bootstrap
                echo "FORGE_BOOTSTRAP_FAILED: the pinned forge lane code failed to install (missing tool - infrastructure/config, never code repair)"
                exit 1
              }
              printf '{"pin":"git-ref","route":"%s","ref":"%s","qualified":true}\n' \
                "$FORGE_INSTALL_MODE" "$FORGE_LANE_REF_RESOLVED" > .forge/lane_install.json
              FORGE_LANE_EXPECTED_VERSION="${FORGE_LANE_REF_RESOLVED#v}"
              ;;
          esac
          # Q35-08/R36-07: installed-identity verification, BEFORE any model
          # call (this step precedes the driver step — vendor work has not
          # started). The resolved FORGE_INSTALL_MODE names the route that
          # selected the lane code; the imported package must report exactly
          # the expected version. The identity lands in
          # .forge/install-identity.json (beside lane_install.json, for the
          # provenance report); the deeper profile_digest comparison already
          # rides --emit-meta (#244's envelope). A dev source install carries
          # no expected version (a moving ref is never a pinned identity)
          # and records its identity un-gated.
          INSTALLED_FORGE_VERSION="$(python -c 'import forge; print(forge.__version__)' 2>/dev/null || true)"
          printf '{"route":"%s","expected_version":"%s","installed_version":"%s"}\n' \
            "$FORGE_INSTALL_MODE" "$FORGE_LANE_EXPECTED_VERSION" "$INSTALLED_FORGE_VERSION" \
            > .forge/install-identity.json
          if [ -n "$FORGE_LANE_EXPECTED_VERSION" ] && [ "$INSTALLED_FORGE_VERSION" != "$FORGE_LANE_EXPECTED_VERSION" ]; then
            echo "failed" > .forge/bootstrap
            echo "FORGE_LANE_INSTALL_IDENTITY_MISMATCH: the lane profile pinned forge $FORGE_LANE_EXPECTED_VERSION but the installed lane reports '${INSTALLED_FORGE_VERSION:-<not importable>}' — upgrade the lane BEFORE dispatching model work: regenerate the template pin with python3 scripts/generate_template_pins.py from the promoted record, or pin FORGE_LANE_WHEEL/FORGE_LANE_REF to the promoted release (infrastructure/config, never code repair)"
            exit 1
          fi
          # The brief's quality bar tells the agent to run the tests — the
          # lane must carry the tooling for that (LIVE-found: bare hosted
          # python has no pytest, and the agent burned turns on denied
          # attempts to check).
          # PIN to the repo's own lock when it has one: a pip-latest ruff
          # formats differently than the CI-pinned one and every candidate
          # fails lint with "Would reformat" (LIVE-found on PR #30 — the
          # drift burned two repair cycles on a healthy candidate).
          RUFF_VER=$(grep -A1 '^name = "ruff"$' uv.lock 2>/dev/null | grep -m1 -o '"[0-9][^"]*"' | tr -d '"')
          PYTEST_VER=$(grep -A1 '^name = "pytest"$' uv.lock 2>/dev/null | grep -m1 -o '"[0-9][^"]*"' | tr -d '"')
          # Carry the SAME environment the repo's own gates run in: when the
          # target has a uv.lock, sync it (mypy/ruff/pytest + all runtime deps
          # at locked versions) so the agent can run the exact commands CI
          # enforces - `uv run mypy` without the deps is a lie. Fallback for
          # lock-less repos: minimal pip toolchain.
          if [ -f uv.lock ]; then
            pip install uv || true
            # Deterministic install (A18): --frozen materializes EXACTLY the
            # repo's lock — the same build/test contract target CI runs,
            # never a lane-time re-resolution. On failure the pinned minimal
            # toolchain still installs so the lane can finish and report the
            # bootstrap failure honestly (classification above).
            if uv sync --frozen; then
              echo "ok" > .forge/bootstrap
            else
              echo "failed" > .forge/bootstrap
              echo "FORGE_BOOTSTRAP_FAILED: uv sync --frozen could not materialize the locked environment (infrastructure/config, never code repair)"
              pip install ${RUFF_VER:+ruff==${RUFF_VER}} ${PYTEST_VER:+pytest==${PYTEST_VER}} || true
            fi
          else
            echo "ok" > .forge/bootstrap
            pip install ${RUFF_VER:+ruff==${RUFF_VER}} || pip install "ruff>=0.4" || true
            pip install ${PYTEST_VER:+pytest==${PYTEST_VER}} || pip install pytest || true
          fi
          if echo "$FORGE_HARNESS_MCP" | grep -q codegraph; then
            # NEXT-17: the MCP binary rides a LOCK, not a bare version
            # spec. The lock is materialized from the pinned spec
            # (--package-lock-only), checked against the template's
            # FORGE_MCP_LOCK_SHA256 when set (resolution drift is refused,
            # not silently taken), and `npm ci` installs EXACTLY the lock —
            # npm verifies every tarball against the lock's sha512
            # integrity before executing it (a tampered registry artifact
            # fails the install instead of running).
            mkdir -p .forge/tools/codegraph
            (
              cd .forge/tools/codegraph
              npm install --package-lock-only --no-fund --no-audit @colbymchenry/codegraph@1.6.0
              if [ -n "${FORGE_MCP_LOCK_SHA256:-}" ]; then
                LOCK_SHA="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' package-lock.json)"
                if [ "$LOCK_SHA" != "$FORGE_MCP_LOCK_SHA256" ]; then
                  echo "FORGE_BOOTSTRAP_FAILED: codegraph lock hash mismatch — expected sha256:$FORGE_MCP_LOCK_SHA256, got sha256:$LOCK_SHA (infrastructure/config, never code repair)"
                  exit 1
                fi
              fi
              npm ci --no-fund --no-audit
            ) || {
              echo "failed" > .forge/bootstrap
              echo "FORGE_BOOTSTRAP_FAILED: the locked codegraph MCP install failed (infrastructure/config, never code repair)"
              exit 1
            }
            export PATH="$PWD/.forge/tools/codegraph/node_modules/.bin:$PATH"
            codegraph telemetry off
            timeout 300 codegraph init
          fi
          python -m forge.harness_entry --render-brief

      - name: Run harness driver
        env:
          FORGE_DRIVER: ${{ inputs.driver }}
          FORGE_MODEL: ${{ inputs.model }}
          FORGE_BRIEF: .forge/brief.md
          FORGE_EXIT_FILE: .forge/exit
          # Non-empty on a repair re-dispatch: the driver then caps the
          # model's per-turn thinking budget (guided fix — wall time is
          # dominated by long thinking turns).
          FORGE_REPAIR_CONTEXT: ${{ inputs.repair_context }}
          # R15 minimal lane credentials: ONLY the selected driver's secrets
          # render (the others resolve to '' — a driver never sees another
          # provider's key; provider-native subscriptions are not
          # interchangeable API keys, so each driver carries exactly the
          # credential its unattended contract consumes. BYOK swaps are a
          # configuration decision, never detected or enforced here).
          #   claude-code: ANTHROPIC_* (+ ZAI_API_KEY via the
          #     Anthropic-compatible coding endpoint)
          #   claude-sdk-lane: the same ANTHROPIC_* gateway recipe (EXE-02)
          #   grok-build: FORGE_GROK_AUTH (full ~/.grok/auth.json contents)
          #   opencode: ZAI_API_KEY
          #   codex-sdk-lane: OPENAI_API_KEY/CODEX_API_KEY (+ FORGE_CODEX_AUTH
          #     — the optional ChatGPT-login blob)
          #   opencode-sdk-lane: the same ZAI_API_KEY the batch lane uses
#   copilot-sdk-lane: the same COPILOT_GITHUB_TOKEN fine-grained PAT
#     the batch copilot lane uses (the ACP child reads the env)
          #   copilot: COPILOT_GITHUB_TOKEN
          ANTHROPIC_API_KEY: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_AUTH_TOKEN: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_AUTH_TOKEN || '' }}
          ANTHROPIC_BASE_URL: ${{ (inputs.driver == 'claude-code' || inputs.driver == 'claude-sdk-lane') && secrets.ANTHROPIC_BASE_URL || '' }}
          ZAI_API_KEY: ${{ (inputs.driver == 'opencode' || inputs.driver == 'opencode-sdk-lane') && secrets.ZAI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.driver == 'codex-sdk-lane' && secrets.OPENAI_API_KEY || '' }}
          CODEX_API_KEY: ${{ inputs.driver == 'codex-sdk-lane' && secrets.CODEX_API_KEY || '' }}
          FORGE_CODEX_AUTH: ${{ inputs.driver == 'codex-sdk-lane' && secrets.FORGE_CODEX_AUTH || '' }}
          FORGE_GROK_AUTH: ${{ inputs.driver == 'grok-build' && secrets.FORGE_GROK_AUTH || '' }}
          COPILOT_GITHUB_TOKEN: ${{ (inputs.driver == 'copilot' || inputs.driver == 'copilot-sdk-lane') && secrets.COPILOT_GITHUB_TOKEN || '' }}
          # R15: per-driver CLI version pins (JSON object driver → version;
          # "latest" = unpinned). A repo VARIABLE like FORGE_HARNESS_MCP —
          # unset falls back to forge's known-good defaults.
          FORGE_DRIVER_VERSIONS: ${{ vars.FORGE_DRIVER_VERSIONS }}
          # MCP (ADR-0022): canonical mcpServers JSON from a repo VARIABLE
          # (not secret — it references secrets by ${VAR} name); an empty
          # value means strict isolation with no servers.
          FORGE_HARNESS_MCP: ${{ vars.FORGE_HARNESS_MCP }}
          # NXT-11: lane_driver reads the steering switch HERE (the driver
          # step is the process that attaches the steering session; the
          # brief step's copy above does not cross step boundaries).
          FORGE_STEERING_ENABLED: ${{ vars.FORGE_STEERING_ENABLED || '' }}
          # The steering attach scopes to the work id (FORGE_RUN_ID —
          # the same id the control plane books commands under).
          FORGE_RUN_ID: ${{ inputs.run_id }}
          # NXT-10 outbound leg (EXE-04 — the lane dials OUT, no inbound
          # listener): the control-plane URL is a repo VARIABLE; the TOKEN
          # is the work-scoped lane credential HMAC(run-id) the dispatch
          # provisions under the server's FORGE_LANE_CONTROL_SECRET, held
          # as a repo SECRET. SDK lanes only — the scripted drivers have
          # no steering attach to feed. Both empty → the lane honestly
          # stays on its local mailbox.
          FORGE_LANE_CONTROL_URL: ${{ (inputs.driver == 'claude-sdk-lane' || inputs.driver == 'codex-sdk-lane' || inputs.driver == 'opencode-sdk-lane' || inputs.driver == 'copilot-sdk-lane') && vars.FORGE_LANE_CONTROL_URL || '' }}
          FORGE_LANE_CONTROL_TOKEN: ${{ (inputs.driver == 'claude-sdk-lane' || inputs.driver == 'codex-sdk-lane' || inputs.driver == 'opencode-sdk-lane' || inputs.driver == 'copilot-sdk-lane') && inputs.lane_control_token || '' }}
          # R32-04: the WIP-continuity contract the DISPATCH selected —
          # mapped onto the env spelling lane_driver's resume_mode()
          # reads: required → the truthy marker (the checkpoint restore is
          # a precondition of the turn), restart → the literal discard
          # marker, fresh/absent → '' (a first run; a 404 restore is
          # normal). Never a repo variable: the resume behavior is the
          # dispatch's product decision, not lane-local setup.
          FORGE_LANE_RESUME: ${{ (inputs.lane_resume_mode == 'required' && '1') || (inputs.lane_resume_mode == 'restart' && 'restart') || '' }}
        run: |
          # Driver provisioning + invocation is rendered by forge's
          # HarnessDriver (claude-code | grok-build | opencode | copilot):
          #   - installs the pinned CLI (retry, platform binary check)
          #   - runs the agent unattended; the -p prompt is the SHORT
          #     pointer at .forge/brief.md (the shared brief IS the prompt)
          #   - streams normalized events into the job log
          #   - writes .forge/exit (completed|failed) — file presence is
          #     decoupled from agent exit status
          python -m forge.harness_entry

      - name: Emit candidate artifact
        if: always()
        run: |
          # Q35-01: the candidate bytes are collected by the packaged
          # collector — NEVER by inline git in the original checkout. A
          # resumed lane restored its WIP into a stable SIBLING generation
          # (.forge-workspace-gen-<id>/) and chdir'd the LANE process
          # there; this step's fresh shell still sits in the checkout, so
          # the collector resolves the ACTIVE tree through the checkout's
          # .forge/workspace-generation pointer (ownership-validated: a
          # forged or foreign pointer yields zero artifacts and a red
          # step). A fresh run has no pointer and collects the checkout
          # itself — the classic no-resume flow, byte-compatible. The
          # infrastructure cleanup (.codegraph/.venv/__pycache__/
          # .pytest_cache/*.pyc) runs INSIDE the collected tree, inside
          # the collector.
          # R16/A08: stage the candidate in a directory whose name carries
          # NO leading dot. upload-artifact@v4 (>= 4.4.0) excludes hidden
          # files by default AND its globber drops dot-directories before
          # traversal — a leading-dot staging name uploads NOTHING on a
          # fresh repo (if-no-files-found: error fired every run). Only the
          # two contract files are ever staged here; nothing else can ride
          # along, so include-hidden-files stays unnecessary.
          rm -rf forge-output && mkdir -p forge-output
          # A Git failure here FAILS the step — the old failure-swallowing
          # suffix (a failed diff silently becoming an empty "successful"
          # candidate) is gone; a zero-change candidate stays a valid
          # exit-0 result.
          # R36-01: the collection is bound to the TRUSTED dispatch
          # identity, never to the agent-writable pointer alone — the
          # expected checkpoint rides the dispatch (inputs.checkpoint_id,
          # empty until the control-plane dispatch surface carries the
          # bound checkpoint id; empty is the EXPLICIT fresh/legacy mode,
          # recorded checkpoint_binding=unbound, never a guess), and a
          # REQUIRED-resume dispatch additionally demands the generation
          # pointer (--require-generation): the resumed candidate never
          # silently degrades to collecting the untouched checkout.
          python -m forge.harness_entry --collect-candidate \
            --forge-run-id "${{ inputs.run_id }}" \
            --attempt-base-oid "${{ inputs.attempt_base_oid }}" \
            --expected-checkpoint-id "${{ inputs.checkpoint_id || '' }}" \
            ${{ inputs.lane_resume_mode == 'required' && '--require-generation' || '' }} \
            --output-root forge-output
          # Meta schema v2 (schema_version, run + GitHub attempt identity,
          # sha256 digest binding the meta to the exact diff bytes, usage
          # receipt; A18 adds the additive `bootstrap` classification and
          # the executed execution-profile `profile_digest` fields) is
          # built by the same pinned
          # forge the lane runs — one schema, one test suite, never a
          # heredoc copy of it. The .forge/usage.json receipt rides INSIDE
          # the meta so usage reaches the control plane with the candidate
          # (R23).
          python -m forge.harness_entry --emit-meta \
            --forge-run-id "${{ inputs.run_id }}" \
            --attempt-base-oid "${{ inputs.attempt_base_oid }}" \
            --driver "${{ inputs.driver }}" \
            --model "${{ inputs.model }}"

      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-candidate-${{ inputs.run_id }}
          # The staged non-hidden directory (R16/A08): its two files land
          # in the zip under their basenames (the v4 least-common-ancestor
          # rule) — the exact layout the control plane's basename matcher
          # consumes. The name MUST NOT start with a dot (A08): the v4
          # globber drops dot-directories before traversal.
          path: forge-output
          if-no-files-found: error
          retention-days: 7

# forge implementer harness — claude-code (ADR-0015)
#
# Included ONCE by a target project's .gitlab-ci.yml at onboarding (a
# human-applied, static include — see docs/harness-onboarding.md):
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/<org>/forge/main/ci/templates/claude-code.gitlab-ci.yml'
#
# The job only runs when forge triggers a pipeline with $FORGE_RUN_ID set —
# regular pipelines (MRs, pushes by humans) skip it via the rules block.
#
# Required project CI variables (masked/protected per policy; forge stores
# none of them — ADR-0015 §4):
#   ANTHROPIC_AUTH_TOKEN   harness API key (never forge's)
#   ANTHROPIC_BASE_URL     harness API base URL (self-hosted gateway/proxy)
#   FORGE_BOT_TOKEN        bot PAT with write access to the factory branch
#
# Runner requirements: ephemeral docker executor, no privileged mode, no
# Docker socket, no production secrets (ADR-0002 execution profile).
#
# Result contract (ADR-0015 §3): the job commits and pushes to the factory
# branch it was started on, then prints a machine-readable last line:
#   FORGE_RESULT:{"head": "<sha>", "summary": "..."}
# forge verifies the branch head independently and never trusts this claim.

forge-agent:
  image: node:22-bookworm
  timeout: 30m
  rules:
    - if: '$FORGE_RUN_ID'
  variables:
    ANTHROPIC_MODEL: "glm-5.3-flash[1m]"
    API_TIMEOUT_MS: "300000"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    # GitLab docker executors run containers as root; claude refuses
    # --dangerously-skip-permissions for root unless told it is sandboxed.
    # The ephemeral CI container IS the execution profile (ADR-0002).
    IS_SANDBOX: "1"
  before_script:
    - npm install -g @anthropic-ai/claude-code
    - git config user.name "forge"
    - git config user.email "forge@users.noreply.gitlab.com"
    # Push credentials on origin (same pattern as GitLab Duo external agents):
    # the job pushes with the bot token configured as a project CI variable.
    - 'git remote set-url origin "https://forge:${FORGE_BOT_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"'
  script:
    # Live visibility: the compacted agent-event stream (tool calls,
    # thinking, API errors, retries, final result) flows into the job trace
    # while the harness works — GitLab tails job traces live. The full
    # stream-json log stays in /tmp/claude-events.jsonl for the final tail.
    - 'curl -fsSL https://raw.githubusercontent.com/forcewake/forge/main/ci/templates/claude-events-filter.mjs -o /tmp/filter.mjs'
    # The task brief: approved plan, written to an ephemeral file (ADR-0012:
    # context passes through GitLab CI variables, not forge-side state).
    - printf '%s\n' "$FORGE_PLAN" > /tmp/brief.md
    # Headless harness run. A nonzero exit does not abort the audit trail:
    # we still report the branch state so forge can verify (pipefail keeps
    # claude's exit code through the tee/filter pipeline).
    - set -o pipefail
    # Permission posture mirrors GitLab Duo external agents: file edits are
    # auto-accepted (acceptEdits), shell is scoped to git only, and the run
    # loads no external settings (prompt-injection surface reduction).
    # In -p mode un-allowed tools are auto-denied, never prompted.
    - >-
      claude -p "Implement the task described in /tmp/brief.md for issue
      #$FORGE_ISSUE_IID. Work in the current repository. Commit your changes
      with message: forge: implement issue $FORGE_ISSUE_IID (run
      ${FORGE_RUN_ID:0:8}). Do not push." --model "$ANTHROPIC_MODEL"
      --allowedTools "Bash(git:*)" --permission-mode acceptEdits
      --setting-sources '' --output-format stream-json --verbose 2>&1
      | tee /tmp/claude-events.jsonl
      | node /tmp/filter.mjs
      || echo "claude exited nonzero — verifying branch state anyway"
    # The harness may or may not have committed. Stage everything and commit
    # ONLY if there are staged changes; never amend or rewrite history.
    - git add -A
    - |
      if ! git diff --cached --quiet; then
        git commit -m "forge: implement issue $FORGE_ISSUE_IID (run ${FORGE_RUN_ID:0:8})"
      fi
    # Push the factory branch. With no changes this is a harmless no-op
    # ("Everything up-to-date") — forge detects the unchanged head and
    # classifies it as harness_no_changes.
    - git push origin "HEAD:${CI_COMMIT_REF_NAME}"
    # Machine-readable result. head == base sha ⇒ no changes were made;
    # anything else must match the real branch head or forge rejects it.
    - 'printf "FORGE_RESULT:{\"head\": \"%s\", \"summary\": \"done\"}\n" "$(git rev-parse HEAD)"'

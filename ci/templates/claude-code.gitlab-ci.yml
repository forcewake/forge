# forge implementer harness — claude-code (ADR-0015/0016)
#
# Included ONCE by a target project's .gitlab-ci.yml at onboarding (a
# human-applied, static include — see docs/harness-onboarding.md):
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/<org>/forge/main/ci/templates/claude-code.gitlab-ci.yml'
#
# The job only runs when forge triggers a pipeline with $FORGE_RUN_ID set —
# regular pipelines (MRs, pushes by humans) skip it via the rules block,
# which also filters on $FORGE_HARNESS_DRIVER (ADR-0023 §7): a repo that
# includes several forge templates runs exactly one lane (driver: claude-code).
#
# Required project CI variables (masked/protected per policy; forge stores
# none of them — ADR-0015 §4):
#   ANTHROPIC_AUTH_TOKEN   harness API key (never forge's)
#   ANTHROPIC_BASE_URL     harness API base URL (self-hosted gateway/proxy)
#   FORGE_BOT_READ_TOKEN   OPTIONAL read-only PAT (repo read only). The
#                          proposal-only lane (ADR-0016) must NEVER receive
#                          a write token; when unset the lane keeps the
#                          runner's default fetch credential only.
#
# Runner requirements: ephemeral docker executor, no privileged mode, no
# Docker socket, no production secrets (ADR-0002 execution profile).
#
# Candidate contract (ADR-0016 §1, proposal-only): the job checks out the
# frozen attempt base ($FORGE_ATTEMPT_BASE, detached), runs the driver
# WITHOUT any commit/push capability, and uploads the working-tree delta as
# CI artifacts:
#   .forge/candidate.diff        git diff --binary --full-index vs the base
#   .forge/candidate.meta.json   attempt base, driver, model, exit, usage
# The last trace lines carry the machine-readable markers:
#   FORGE_CANDIDATE:{"attempt_base": "<oid>", "artifact": "candidate.diff", "exit": "<completed|failed>"}
#   FORGE_RESULT:{"head": "<attempt_base>", "summary": "..."}   (legacy v0.2 line, migration only)
# forge downloads the artifacts and publishes via the trusted publisher;
# claims in the trace are never trusted.

forge-agent:
  image: node:22-bookworm
  timeout: 30m
  rules:
    # ADR-0023 §7: a repo including MULTIPLE forge templates runs exactly
    # one lane — the one whose driver matches $FORGE_HARNESS_DRIVER (set by
    # the dispatch leg). Unset/empty keeps single-driver repos as before.
    - if: '$FORGE_RUN_ID && ($FORGE_HARNESS_DRIVER == "" || $FORGE_HARNESS_DRIVER == "claude-code")'
  variables:
    ANTHROPIC_MODEL: "glm-5.3-flash[1m]"
    API_TIMEOUT_MS: "300000"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    # GitLab docker executors run containers as root; claude refuses
    # --dangerously-skip-permissions for root unless told it is sandboxed.
    # The ephemeral CI container IS the execution profile (ADR-0002).
    IS_SANDBOX: "1"
  before_script:
    - |
      for attempt in 1 2 3; do
        npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${FORGE_CLAUDE_VERSION:-latest}" && break
        echo "npm install of claude-code failed (attempt $attempt), retrying..."
        sleep $((attempt * 5))
      done
      claude --version
    - export NO_PROXY="${CI_SERVER_HOST},127.0.0.1,localhost"
    - git config user.name "forge"
    - git config user.email "forge@users.noreply.gitlab.com"
    # Proposal-only lane (ADR-0016): the remote carries a READ-ONLY
    # credential at most, and push is disabled by construction — the job has
    # nothing to push even if the model tried.
    - 'git remote set-url origin "https://forge:${FORGE_BOT_READ_TOKEN:-forge:placeholder}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"'
    - git remote set-url --push origin FORBIDDEN
    # .forge/ is a control directory: local-only, never staged, never
    # committed (ADR-0016 §1 step 5).
    - mkdir -p .forge
    - mkdir -p .git/info && echo ".forge/" >> .git/info/exclude
    # Check out the FROZEN attempt base (detached). The pipeline ref is the
    # factory branch, whose head IS the attempt base in the proposal-only
    # model — nothing else ever pushes to it.
    - git fetch origin "$CI_COMMIT_REF_NAME" || git fetch origin || true
    - git checkout --detach "$FORGE_ATTEMPT_BASE"
  script:
    # Live visibility: the compacted agent-event stream (tool calls,
    # thinking, API errors, retries, final result) flows into the job trace
    # while the harness works — GitLab tails job traces live. The full
    # stream-json log stays in /tmp/harness.jsonl for the final tail;
    # the filter also aggregates usage receipts into .forge/usage.json.
    - 'curl -fsSL https://raw.githubusercontent.com/forcewake/forge/main/ci/templates/harness-log-filter.mjs -o /tmp/filter.mjs'
    - export FORGE_LOG_PLATFORM=gitlab
    # The task brief: approved plan, written to an ephemeral file (ADR-0012:
    # context passes through GitLab CI variables, not forge-side state).
    - printf '%s\n' "$FORGE_PLAN" > /tmp/brief.md
    - set -o pipefail
    # Headless harness run. The driver NEVER commits or pushes: its
    # working-tree edits ARE the candidate. A nonzero exit does not abort
    # the audit trail — the artifacts still upload (when: always) and forge
    # classifies the run as failed (pipefail keeps claude's exit code
    # through the tee/filter pipeline).
    # Permission posture mirrors GitLab Duo external agents: file edits are
    # auto-accepted (acceptEdits), shell is scoped to git only, and the run
    # loads no external settings (prompt-injection surface reduction).
    # In -p mode un-allowed tools are auto-denied, never prompted.
    - |
      FORGE_DRIVER_EXIT="completed"
      export API_TIMEOUT_MS=3000000 BASH_DEFAULT_TIMEOUT_MS=300000 BASH_MAX_TIMEOUT_MS=600000
      # MCP (ADR-0022): servers come ONLY from the FORGE_HARNESS_MCP CI
      # variable (canonical mcpServers JSON; ${VAR} refs inside expand at
      # runtime, so server keys stay in separate masked CI variables).
      # --strict-mcp-config means ONLY this config loads — the repo's own
      # .mcp.json is ignored (injection-surface reduction, same posture as
      # --setting-sources ''). Each configured server gets its MCP tools
      # granted explicitly; MCP tools can never circumvent the git
      # deny rules or the FORBIDDEN push URL.
      # The quality bar demands the agent RUN the tests (ADR-0008): the
      # allowlist carries the repo's own test/lint commands, scoped to the
      # in-repo venv + uv. Anything else is auto-denied in -p mode.
      CLAUDE_TOOLS="Bash(git status:*),Bash(git diff:*),Bash(git log:*),ls:*,cat:*,grep:*,head:*,tail:*,wc:*,which:*,.venv/bin/python -m pytest*,.venv/bin/python -m pytest,python3 -m pytest*,python3 -m pytest,python -m pytest*,pytest,uv run pytest*,uv run ruff*,.venv/bin/ruff*,python3 -m ruff*,uv run mypy*,python3 -m mypy*,python -m mypy*,uv sync"
      if [ -n "$FORGE_HARNESS_MCP" ]; then
        printf '%s' "$FORGE_HARNESS_MCP" > /tmp/forge-mcp.json
        for n in $(node -e 'const s=JSON.parse(process.argv[1]);const m=s.mcpServers||s;console.log(Object.keys(m).join("\n"))' "$FORGE_HARNESS_MCP"); do
          CLAUDE_TOOLS="$CLAUDE_TOOLS,mcp__${n}__*,mcp__${n}"
        done
      else
        echo '{"mcpServers":{}}' > /tmp/forge-mcp.json
      fi
      claude -p "Implement the task described in /tmp/brief.md for issue #$FORGE_ISSUE_IID. Work in the current repository. Do NOT commit and do NOT push: leave your changes in the working tree for collection." \
        --model "$ANTHROPIC_MODEL" \
        --allowedTools "$CLAUDE_TOOLS" \
        --disallowedTools "Bash(git commit:*)" "Bash(git push:*)" \
        --permission-prompts none \
        --permission-mode acceptEdits \
        --max-turns 200 \
        --mcp-config /tmp/forge-mcp.json --strict-mcp-config \
        --setting-sources '' --output-format stream-json --verbose 2>&1 \
        | tee /tmp/harness.jsonl \
        | node /tmp/filter.mjs claude-code \
        || FORGE_DRIVER_EXIT="failed"
      export FORGE_DRIVER_EXIT
    # Stage the whole working tree and capture the candidate diff against
    # the FROZEN attempt base. No commit, no push — the artifact is the
    # deliverable.
    - git add -A
    - git diff --cached --binary --full-index "$FORGE_ATTEMPT_BASE" > .forge/candidate.diff
    # Meta JSON: attempt base, driver id, model, exit classification, usage
    # receipt (assembled by the event filter from the parsed result events).
    - |
      node -e '
        const fs = require("fs");
        let usage = null;
        try { usage = JSON.parse(fs.readFileSync(".forge/usage.json", "utf8")); } catch {}
        fs.writeFileSync(".forge/candidate.meta.json", JSON.stringify({
          attempt_base: process.env.FORGE_ATTEMPT_BASE || "",
          driver: "claude-code",
          model: process.env.ANTHROPIC_MODEL || "",
          exit: process.env.FORGE_DRIVER_EXIT || "completed",
          usage,
        }));
      '
    # Machine-readable contract. FORGE_CANDIDATE points at the artifact the
    # backend downloads; the legacy FORGE_RESULT line stays only for the
    # v0.2 → v0.3 migration window and carries the attempt base — it is not
    # a branch claim anymore.
    - 'printf "FORGE_CANDIDATE:{\"attempt_base\": \"%s\", \"artifact\": \"candidate.diff\", \"exit\": \"%s\"}\n" "$FORGE_ATTEMPT_BASE" "$FORGE_DRIVER_EXIT"'
    - 'printf "FORGE_RESULT:{\"head\": \"%s\", \"summary\": \"candidate artifacts; proposal-only lane\"}\n" "$FORGE_ATTEMPT_BASE"'
  artifacts:
    paths:
      - .forge/candidate.diff
      - .forge/candidate.meta.json
    when: always
    expire_in: 1 week

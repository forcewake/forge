# forge implementer harness — claude-sdk-lane (EXE-02: the execution lane,
# driven by the REAL interactive Claude Agent SDK driver)
#
# The INTERACTIVE twin of claude-code.gitlab-ci.yml: same skeleton, same
# rules, same proposal-only candidate contract — but the agent is driven
# by forge's own driver client (forge.adaptive.drivers.claude_sdk, via
# `python -m forge.lane_driver`) instead of a scripted `claude -p` call.
# One task, poll-drained to its ResultMessage, bounded by an overall
# budget; the same .forge/ artifacts come out the other end.
#
# Included ONCE by a target project's .gitlab-ci.yml at onboarding (a
# human-applied, static include — see docs/harness-onboarding.md):
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/<org>/forge/main/ci/templates/claude-sdk-lane.gitlab-ci.yml'
#
# The job only runs when forge triggers a pipeline with $FORGE_RUN_ID set —
# regular pipelines (MRs, pushes by humans) skip it via the rules block,
# which also filters on $FORGE_HARNESS_DRIVER (ADR-0023 §7): a repo that
# includes several forge templates runs exactly one lane
# (driver: claude-sdk-lane).
#
# Dispatched pipeline variables (R37-07 / issue #288 — the dispatch
# envelope; GitLab exports every pipeline variable into the job env, so
# the driver step below consumes them directly):
#   FORGE_RUN_ID / FORGE_ISSUE_IID / FORGE_PLAN / FORGE_HARNESS_MODEL /
#   FORGE_HARNESS_DRIVER / FORGE_ATTEMPT_BASE   (the frozen brief)
#   FORGE_LANE_RESUME ("1" | "restart" | "") + FORGE_LANE_RESUME_MODE —
#     the WIP-continuity contract the dispatch selected:
#     "1" (required) makes the pre-turn restore of the held checkpoint a
#     PRECONDITION (a failed download halts the lane before any vendor
#     session exists — zero model turns); "restart" discards the WIP by
#     operator choice; "" (fresh) restores nothing.
#   FORGE_RESUME_CHECKPOINT — the EXACT checkpoint content address the
#     persisted continuation decision approved (empty on fresh/restart);
#     the lane's binding itself comes from the control plane's durable
#     resume-spec (work_id@checkpoint_id), this is the dispatched pin the
#     trace reconciles against.
#   FORGE_ATTEMPT_GENERATION + FORGE_CONTINUATION_DECISION_ID — the
#     durable attempt identity the credentials are scoped to and the
#     decision identity this dispatch executes.
#   FORGE_LANE_CONTROL_URL / FORGE_LANE_CONTROL_TOKEN — the lane-control
#     dial-out pair (NXT-10: the lane dials OUT; the token is the
#     attempt-scoped HMAC the dispatch minted — never a control-plane
#     root secret, never a publication token). Steering stays OFF unless
#     the project sets FORGE_STEERING_ENABLED (below).
#
# Required project CI variables (masked/protected per policy; forge stores
# none of them — ADR-0015 §4):
#   ANTHROPIC_AUTH_TOKEN   harness API key (never forge's)
#   ANTHROPIC_BASE_URL     harness API base URL (self-hosted gateway/proxy)
#   FORGE_BOT_READ_TOKEN   OPTIONAL read-only PAT (repo read only). The
#                          proposal-only lane (ADR-0016) must NEVER receive
#                          a write token; when unset the lane keeps the
#                          runner's default fetch credential only.
#
# Runner requirements: ephemeral docker executor, no privileged mode, no
# Docker socket, no production secrets (ADR-0002 execution profile).
#
# Candidate contract (ADR-0016 §1, proposal-only): the job checks out the
# frozen attempt base ($FORGE_ATTEMPT_BASE, detached), runs the driver
# WITHOUT any commit/push capability, and uploads the working-tree delta as
# CI artifacts:
#   .forge/candidate.diff        git diff --binary --full-index vs the base
#   .forge/candidate.meta.json   attempt base, driver, model, exit, usage
# The delta is collected by the PACKAGED generation-aware collector
# (R38-01/#302 — `python -m forge.harness_entry --collect-candidate`):
# a resumed agent works in the SIBLING workspace generation the checkout's
# .forge/workspace-generation pointer names, and the collector validates
# that pointer's ownership, runs `git -C` on the validated tree and fails
# typed on Git errors — never inline staging on the original checkout
# (which shipped an empty diff beside a full generation). The candidate is
# ADVERTISED only when BOTH the driver and the collector succeeded; the
# script runs driver / collection / final-status phases in ONE shell and
# exits exactly once (an early `exit` on driver success used to kill the
# job before collection — the live harness_artifact_missing run).
# The last trace lines carry the machine-readable markers:
#   FORGE_CANDIDATE:{"attempt_base": "<oid>", "artifact": "candidate.diff", "exit": "<completed|failed>"}
#   FORGE_LANE_OUTCOME:{"driver_exit": "<completed|failed>", "collector_exit": <rc>, "candidate_state": "<candidate|zero_change|driver_failed|collection_failed>"}
#   FORGE_RESULT:{"head": "<attempt_base>", "summary": "..."}   (legacy v0.2 line, migration only)
# (the collector's own JSON result above them carries collected_generation
# and artifact_digest as further separate, non-secret fields).
# forge downloads the artifacts and publishes via the trusted publisher;
# claims in the trace are never trusted.

forge-agent-claude-sdk:
  image: node:22-bookworm
  timeout: 30m
  rules:
    # ADR-0023 §7: a repo including MULTIPLE forge templates runs exactly
    # one lane — the one whose driver matches $FORGE_HARNESS_DRIVER (set by
    # the dispatch leg). Unset/empty keeps single-driver repos as before.
    - if: '$FORGE_RUN_ID && ($FORGE_HARNESS_DRIVER == "" || $FORGE_HARNESS_DRIVER == "claude-sdk-lane")'
  variables:
    ANTHROPIC_MODEL: "glm-5.3-flash[1m]"
    API_TIMEOUT_MS: "300000"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    # GitLab docker executors run containers as root; the CLI refuses
    # headless bypass mode for root unless told it is sandboxed. The
    # ephemeral CI container IS the execution profile (ADR-0002), and the
    # ambient env flows into the driver's subprocess.
    IS_SANDBOX: "1"
    # The forge ref this lane installs the driver from (the worker can pin
    # by dispatching FORGE_LANE_REF; pipeline variables beat YAML ones).
    FORGE_LANE_REF: "main"
    # NXT-27: the CLI install pin defaults to the LIVE-verified version
    # (docs/evaluation/2026-09-21-drivers — claude 2.1.273), so a vendor
    # release cannot silently change lane behavior; a dispatch/pipeline
    # variable still overrides, and `claude --version` below records what
    # actually installed into the trace.
    FORGE_CLAUDE_VERSION: "2.1.273"
    # NXT-29: the hardened execution profile is OPT-IN. Default stays
    # "v1" — the current documented posture; the dispatch leg or a
    # pipeline variable (which beat YAML ones) selects "v2", the surface
    # declared in forge.runs.execution_profile.LANE_PROFILE_V2: staged
    # credentials (the provider key mounted only for the lane step and
    # stripped from later stages), workspace+tmpfs-only writable mounts,
    # cap_drop ALL, and deny-by-default egress filtered from the
    # FORGE_EGRESS_ALLOWLIST hook below (comma-separated hosts; empty =
    # deny-all for the agent step). v2 requires runner-side enforcement
    # of that surface — deployment work; declaring it without the
    # runner side records intent, it does not isolate.
    FORGE_LANE_PROFILE: "v1"
    FORGE_EGRESS_ALLOWLIST: ""
    # NXT-11: the lane-side steering consumer switch, OFF by default. A
    # project variable (or a dispatched pipeline variable — pipeline
    # variables BEAT YAML ones) turns it on; lane_driver then attaches the
    # steering session over the dispatch's FORGE_LANE_CONTROL_URL/TOKEN
    # pair (R37-07: both ride the dispatch envelope above).
    FORGE_STEERING_ENABLED: ""
    # R38-01 (#302): the lane venv's interpreter — the finalization phases
    # (driver + collection) run through this python. A pipeline/dispatch
    # variable overrides the default (pipeline variables beat YAML ones);
    # the packaged-shell regression tests ride that seam with a stub
    # interpreter on the driver leg.
    FORGE_LANE_PYTHON: "/tmp/forge-lane-venv/bin/python"
  before_script:
    - |
      for attempt in 1 2 3; do
        npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${FORGE_CLAUDE_VERSION:-2.1.273}" && break
        echo "npm install of claude-code failed (attempt $attempt), retrying..."
        sleep $((attempt * 5))
      done
      claude --version
    # Python side: forge requires >=3.13 and Debian bookworm's apt python3
    # is 3.11 (LIVE-found in the ADR-0024 AzDO lab run: pip refused the
    # forge install). apt python3+pip bootstraps uv, which installs a
    # standalone 3.13 and the lane venv. --break-system-packages is only
    # used for the uv bootstrap wheel, never for the lane environment.
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip >/dev/null
    - python3 -m pip install --quiet --no-input --break-system-packages uv
    - uv python install 3.13
    - uv venv /tmp/forge-lane-venv --python 3.13
    - >
      uv pip install --quiet --python /tmp/forge-lane-venv/bin/python
      "forge[interactive] @ git+https://github.com/forcewake/forge@${FORGE_LANE_REF}"
    - export NO_PROXY="${CI_SERVER_HOST},127.0.0.1,localhost"
    - git config user.name "forge"
    - git config user.email "forge@users.noreply.gitlab.com"
    # Proposal-only lane (ADR-0016): the remote carries a READ-ONLY
    # credential at most, and push is disabled by construction — the job has
    # nothing to push even if the model tried.
    - 'git remote set-url origin "https://forge:${FORGE_BOT_READ_TOKEN:-forge:placeholder}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"'
    - git remote set-url --push origin FORBIDDEN
    # .forge/ is a control directory: local-only, never staged, never
    # committed (ADR-0016 §1 step 5).
    - mkdir -p .forge
    - mkdir -p .git/info && echo ".forge/" >> .git/info/exclude
    # Check out the FROZEN attempt base (detached). The pipeline ref is the
    # factory branch, whose head IS the attempt base in the proposal-only
    # model — nothing else ever pushes to it.
    - git fetch origin "$CI_COMMIT_REF_NAME" || git fetch origin || true
    - git checkout --detach "$FORGE_ATTEMPT_BASE"
  script:
    # The task brief: approved plan, written into the REPO's control
    # directory — never /tmp (the sandbox lesson: run context lives with the
    # run, ephemeral scratch does not).
    - printf '%s\n' "$FORGE_PLAN" > .forge/brief.md
    # R37-07 (#288): the dispatch envelope journal — the resume/continuity
    # contract this lane received, recorded BEFORE the driver runs so the
    # trace and the provenance report can reconcile it against the control
    # plane's journaled envelope digest (never the token VALUE — only
    # whether one was dispatched).
    - |
      printf '{"resume_mode":"%s","checkpoint":"%s","attempt_generation":"%s","decision_id":"%s","control_url":"%s","token_dispatched":%s}\n' \
        "${FORGE_LANE_RESUME_MODE:-}" "${FORGE_RESUME_CHECKPOINT:-}" \
        "${FORGE_ATTEMPT_GENERATION:-}" "${FORGE_CONTINUATION_DECISION_ID:-}" \
        "${FORGE_LANE_CONTROL_URL:-}" \
        "$([ -n "${FORGE_LANE_CONTROL_TOKEN:-}" ] && echo true || echo false)" \
        > .forge/dispatch-envelope.json
      echo "forge dispatch envelope: resume=${FORGE_LANE_RESUME_MODE:-fresh} checkpoint=${FORGE_RESUME_CHECKPOINT:-none} attempt=${FORGE_ATTEMPT_GENERATION:-0}"
    # The model route (R38-17 / #318, ADR-0032): dispatched
    # FORGE_CLAUDE_MODEL > the execution spec's FORGE_HARNESS_MODEL pin
    # (the approved RunSpec's frozen route) > the template default —
    # the DOCUMENTED ambient fallback of the unpinned legacy window;
    # the lane never re-derives a pinned choice from ambient state.
    - export FORGE_CLAUDE_MODEL="${FORGE_CLAUDE_MODEL:-${FORGE_HARNESS_MODEL:-$ANTHROPIC_MODEL}}"
    - export FORGE_CLAUDE_CWD="$PWD"
    # R38-02 (#303) — the credential DELIVERY channel (env setup only;
    # native profile (a)): a BOUND dispatch (FORGE_CREDENTIAL_REF set,
    # redemption off) reads the protected + masked project CI/CD variable
    # named FORGE_MODEL_<ref> — runner-side only, NEVER a trigger
    # variable (trigger variables display on job pages and outrank
    # project variables). An empty/missing variable fails the lane CLOSED
    # before any vendor session exists (zero model calls) — no ambient
    # fallback; exactly ONE credential variable is exported and the same
    # family's other credential variables are unset. Profile (b)
    # (FORGE_CREDENTIAL_REDEEM=1) needs nothing here: the driver below
    # redeems through the lane-control channel at startup.
    - |
      if [ -n "${FORGE_CREDENTIAL_REF:-}" ] && [ "${FORGE_CREDENTIAL_REDEEM:-}" != "1" ]; then
        _CRED_VAR="FORGE_MODEL_${FORGE_CREDENTIAL_REF}"
        _CRED_VALUE="${!_CRED_VAR-}"
        if [ -z "$_CRED_VALUE" ]; then
          echo "FORGE_BOOTSTRAP_FAILED: the bound credential variable ${_CRED_VAR} is empty or missing — create it once as a protected + masked project CI/CD variable (Settings → CI/CD → Variables) or dispatch with the runner-redemption profile (infrastructure/config, never code repair)"
          exit 1
        fi
        export ANTHROPIC_AUTH_TOKEN="$_CRED_VALUE"
        unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN 2>/dev/null || true
      fi
    # Interactive driver run (EXE-02): lane_driver reads .forge/brief.md,
    # builds the client from the ambient gateway env, drives ONE task to
    # its ResultMessage and writes the meta + usage receipts. Its task
    # appends the batch lane's unattended posture verbatim — the agent is
    # told: Do NOT commit and do NOT push: leave your changes in the
    # working tree for collection — and the mechanical commit/push deny
    # rides in the driver client (deny beats every permission mode), with
    # the FORBIDDEN push URL as the architectural backstop. No filter.mjs
    # dependency here: plain stdout trace, the meta artifact is what
    # matters. A nonzero exit does not abort the audit trail — the
    # artifacts still upload (when: always) and the final-status phase
    # below fails the job with the driver's own rc.
    # R38-01 (#302): driver / collection / final-status phases in ONE
    # shell. GitLab concatenates before_script + script into a single
    # script whose exit code is the job's, so the old unconditional
    # driver-rc exit killed a SUCCESSFUL job before the meta floor,
    # the collection and the markers ever ran (the live
    # harness_artifact_missing run + the manual guarded-exit patch that
    # never landed). Every phase below runs to its own recorded exit
    # code; the job exits exactly once, at the end.
    - |
      # before_script created .forge/; the phase owns its receipts — keep
      # the floor and the collector-result redirections self-sufficient.
      mkdir -p .forge
      FORGE_DRIVER_EXIT="completed"
      set +e
      "$FORGE_LANE_PYTHON" -m forge.lane_driver
      _driver_rc=$?
      set -e
      if [ "$_driver_rc" -ne 0 ]; then
        FORGE_DRIVER_EXIT="failed"
      fi
      export FORGE_DRIVER_EXIT
      echo "forge lane: driver_exit=$_driver_rc ($FORGE_DRIVER_EXIT)"
      # Defensive meta floor: lane_driver writes the real meta itself; if
      # it died before writing one (install/import crash), the artifacts
      # still carry an honest failed meta instead of nothing. Runs
      # REGARDLESS of the driver rc — driver-failure diagnostics are
      # retained even when the candidate is not advertised below.
      if [ ! -f .forge/candidate.meta.json ]; then
        printf '%s\n' "{\"attempt_base\": \"${FORGE_ATTEMPT_BASE}\", \"driver\": \"claude-sdk-lane\", \"model\": \"${FORGE_CLAUDE_MODEL}\", \"exit\": \"${FORGE_DRIVER_EXIT}\", \"terminal_reason\": \"lane_driver_no_meta\", \"usage\": null}" > .forge/candidate.meta.json
      fi
      # Collection phase — runs REGARDLESS of the driver rc (the
      # artifacts upload when: always; only the ADVERTISEMENT below is
      # success-gated). The PACKAGED generation-aware collector (#260),
      # never inline staging in the ORIGINAL checkout: a resumed agent
      # works in the sibling generation the checkout's
      # .forge/workspace-generation pointer names, and the collector
      # validates that pointer's ownership (work id + exact checkpoint
      # binding, non-following physical checks), runs git -C on the
      # validated tree and fails typed on Git errors — the old inline
      # staging shipped an empty diff beside a full generation.
      # Read-only by construction: no commit, no push. The declared
      # upload location only ever holds THIS attempt's bytes — a stale
      # candidate.diff from an earlier attempt is removed first and is
      # never re-uploaded when collection fails (zero artifacts beat
      # stale artifacts).
      rm -f .forge/candidate.diff
      _collector_flags=""
      if [ "${FORGE_LANE_RESUME:-}" = "1" ]; then
        # A required-resume dispatch: the generation pointer is a
        # precondition — collection refuses rather than silently
        # degrading to the untouched checkout.
        _collector_flags="--require-generation"
      fi
      set +e
      # shellcheck disable=SC2086 — flags are word-split on purpose
      "$FORGE_LANE_PYTHON" -m forge.harness_entry --collect-candidate \
        --forge-run-id "$FORGE_RUN_ID" \
        --attempt-base-oid "$FORGE_ATTEMPT_BASE" \
        --expected-checkpoint-id "${FORGE_RESUME_CHECKPOINT:-}" \
        $_collector_flags \
        --output-root forge-output \
        > .forge/collector-result.json 2> .forge/collector-error.log
      _collector_rc=$?
      set -e
      cat .forge/collector-result.json
      cat .forge/collector-error.log 1>&2
      export FORGE_COLLECTOR_EXIT="$_collector_rc"
      # Candidate advertisement semantics: only a collector-verified
      # candidate is advertised. A driver failure keeps the marker's
      # exit=failed (a FAILED candidate is never a valid one); a
      # collector failure advertises NOTHING.
      _candidate_state="collection_failed"
      if [ "$_collector_rc" -eq 0 ]; then
        cp forge-output/candidate.diff .forge/candidate.diff
        _candidate_state="zero_change"
        if [ -s .forge/candidate.diff ]; then
          _candidate_state="candidate"
        fi
        # Machine-readable contract. FORGE_CANDIDATE points at the
        # artifact the backend downloads; the legacy FORGE_RESULT line
        # stays only for the v0.2 → v0.3 migration window and carries
        # the attempt base — it is not a branch claim anymore. A
        # zero-change candidate keeps the job green — a no-op turn is
        # classified at the run level, never a lane failure.
        printf 'FORGE_CANDIDATE:{"attempt_base": "%s", "artifact": "candidate.diff", "exit": "%s"}\n' "$FORGE_ATTEMPT_BASE" "$FORGE_DRIVER_EXIT"
        printf 'FORGE_RESULT:{"head": "%s", "summary": "candidate artifacts; proposal-only lane"}\n' "$FORGE_ATTEMPT_BASE"
      else
        echo "forge lane: collector_exit=$_collector_rc — no candidate advertised" 1>&2
      fi
      if [ "$_driver_rc" -ne 0 ]; then
        _candidate_state="driver_failed"
      fi
      echo "FORGE_LANE_OUTCOME:{\"driver_exit\": \"$FORGE_DRIVER_EXIT\", \"collector_exit\": $_collector_rc, \"candidate_state\": \"$_candidate_state\"}"
      # Final status: the driver rc wins — a failed turn fails the job
      # (the artifacts still upload via when:always). A GREEN driver with
      # a FAILED collector fails the job too: a completed turn without
      # its artifact is NOT a success. First meaningful failure preserved.
      _job_rc=0
      if [ "$_driver_rc" -ne 0 ]; then
        _job_rc="$_driver_rc"
      elif [ "$_collector_rc" -ne 0 ]; then
        _job_rc="$_collector_rc"
      fi
      exit "$_job_rc"
  artifacts:
    paths:
      - .forge/candidate.diff
      - .forge/candidate.meta.json
    when: always
    expire_in: 1 week

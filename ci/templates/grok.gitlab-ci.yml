# forge implementer harness — grok (xAI Grok Build CLI, ADR-0015/0016)
#
# Included ONCE by a target project's .gitlab-ci.yml at onboarding (a
# human-applied, static include — see docs/harness-onboarding.md):
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/<org>/forge/main/ci/templates/grok.gitlab-ci.yml'
#
# The job only runs when forge triggers a pipeline with $FORGE_RUN_ID set —
# regular pipelines (MRs, pushes by humans) skip it via the rules block.
#
# Required project CI variables (masked/protected per policy; forge stores
# none of them — ADR-0015 §4):
#   FORGE_GROK_AUTH          full contents of ~/.grok/auth.json from a machine
#                            where `grok login` was completed (OAuth bundle
#                            with refresh token — the CLI renews itself)
#   FORGE_BOT_READ_TOKEN     OPTIONAL read-only PAT (repo read only). The
#                            proposal-only lane (ADR-0016) must NEVER receive
#                            a write token; when unset the lane keeps the
#                            runner's default fetch credential only.
#
# Runner requirements: ephemeral docker executor, no privileged mode, no
# Docker socket, no production secrets (ADR-0002 execution profile).
#
# Candidate contract (ADR-0016 §1, proposal-only): the job checks out the
# frozen attempt base ($FORGE_ATTEMPT_BASE, detached), runs the driver
# WITHOUT any commit/push capability, and uploads the working-tree delta as
# CI artifacts:
#   .forge/candidate.diff        git diff --binary --full-index vs the base
#   .forge/candidate.meta.json   attempt base, driver, model, exit, usage
# The last trace lines carry the machine-readable markers:
#   FORGE_CANDIDATE:{"attempt_base": "<oid>", "artifact": "candidate.diff", "exit": "<completed|failed>"}
#   FORGE_RESULT:{"head": "<attempt_base>", "summary": "..."}   (legacy v0.2 line, migration only)
# forge downloads the artifacts and publishes via the trusted publisher;
# claims in the trace are never trusted.

forge-agent:
  image: node:22-bookworm
  timeout: 30m
  rules:
    - if: '$FORGE_RUN_ID'
  before_script:
    # The wrapper declares its platform binary (@xai-official/grok-linux-x64)
    # as an optionalDependency: when the registry flakes, npm silently skips
    # it and the CLI hangs forever at startup (silent futex wait, zero
    # output). Install both explicitly, with retries, and fail loudly if the
    # binary is missing.
    - |
      for attempt in 1 2 3; do
        npm install -g --no-fund --no-audit @xai-official/grok && break
        echo "npm install of grok failed (attempt $attempt), retrying..."
        sleep $((attempt * 5))
      done
    - GROK_VER="$(grok --version | awk '{print $2}')"
    - |
      npm install -g --no-fund --no-audit "@xai-official/grok-linux-x64@${GROK_VER}" \
        || npm install -g --no-fund --no-audit @xai-official/grok-linux-x64
    - test -d /usr/local/lib/node_modules/@xai-official/grok-linux-x64
    - grok --version
    - mkdir -p ~/.grok
    - 'printf "%s" "$FORGE_GROK_AUTH" > ~/.grok/auth.json && chmod 600 ~/.grok/auth.json'
    - git config user.name "forge"
    - git config user.email "forge@users.noreply.gitlab.com"
    # Proposal-only lane (ADR-0016): the remote carries a READ-ONLY
    # credential at most, and push is disabled by construction — the job has
    # nothing to push even if the model tried.
    - 'git remote set-url origin "https://forge:${FORGE_BOT_READ_TOKEN:-forge:placeholder}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"'
    - git remote set-url --push origin FORBIDDEN
    # .forge/ is a control directory: local-only, never staged, never
    # committed (ADR-0016 §1 step 5).
    - mkdir -p .forge
    - echo ".forge/" >> .git/info/exclude
    # Check out the FROZEN attempt base (detached). The pipeline ref is the
    # factory branch, whose head IS the attempt base in the proposal-only
    # model — nothing else ever pushes to it.
    - git fetch origin "$CI_COMMIT_REF_NAME" || git fetch origin || true
    - git checkout --detach "$FORGE_ATTEMPT_BASE"
  script:
    # The task brief lives INSIDE the workspace (ADR-0012: context passes
    # through GitLab CI variables, not forge-side state).
    - printf '%s\n' "$FORGE_PLAN" > .forge/brief.md
    # Live visibility: the compacted streaming-json event lines flow into the
    # job trace while grok works; the raw debug log stays in .forge/ and its
    # tail is printed afterwards (when grok stalls silently, that log says
    # where). The filter also aggregates usage receipts into
    # .forge/usage.json for candidate.meta.json.
    - 'curl -fsSL https://raw.githubusercontent.com/forcewake/forge/main/ci/templates/grok-events-filter.mjs -o /tmp/filter.mjs'
    - set -o pipefail
    # Optional: route harness API traffic through a proxy. Some runner
    # networks throttle long-lived streaming responses from AI providers to
    # a crawl while short requests stay fast; a proxy on a fast path fixes
    # it (verified: one-word prompt 226s direct vs 2s via proxy). NO_PROXY
    # keeps git/npm traffic to GitLab direct.
    - |
      if [ -n "$FORGE_HARNESS_HTTPS_PROXY" ]; then
        export HTTPS_PROXY="$FORGE_HARNESS_HTTPS_PROXY" https_proxy="$FORGE_HARNESS_HTTPS_PROXY"
        export NO_PROXY="$CI_SERVER_HOST,127.0.0.1,localhost"
      fi
    # Headless harness run (--always-approve: the ephemeral CI container is
    # the ADR-0002 execution profile). The driver NEVER commits or pushes:
    # its working-tree edits ARE the candidate. pipefail keeps the driver's
    # exit code through the filter; a nonzero exit does not abort the audit
    # trail — the artifacts still upload (when: always) and forge classifies
    # the run as failed.
    - |
      FORGE_DRIVER_EXIT="completed"
      grok --no-auto-update --always-approve --no-alt-screen \
        --output-format streaming-json \
        --debug-file .forge/grok-debug.log \
        -p "Read .forge/brief.md and implement the task it describes for issue #$FORGE_ISSUE_IID. Work in the current repository. Do NOT commit and do NOT push: leave your changes in the working tree for collection." 2>&1 \
        | node /tmp/filter.mjs \
        || FORGE_DRIVER_EXIT="failed"
      export FORGE_DRIVER_EXIT
    # Post-mortem visibility when the stream produced nothing.
    - 'tail -30 .forge/grok-debug.log 2>/dev/null || true'
    # The brief and the debug log are context, not deliverable — never let
    # them near the candidate.
    - rm -f .forge/brief.md .forge/grok-debug.log
    # Stage the whole working tree, drop build caches (running the
    # implemented code can materialize __pycache__ after the harness's edits
    # — seen live), and capture the candidate diff against the FROZEN
    # attempt base. No commit, no push — the artifact is the deliverable.
    - git add -A
    - git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$' | xargs -r git reset -q -- || true
    - git diff --cached --binary --full-index "$FORGE_ATTEMPT_BASE" > .forge/candidate.diff
    # Meta JSON: attempt base, driver id, model, exit classification, usage
    # receipt (assembled by the event filter from the parsed [grok:usage]
    # events). Token counts unknown to the filter stay null — never zero.
    - |
      node -e '
        const fs = require("fs");
        let usage = null;
        try { usage = JSON.parse(fs.readFileSync(".forge/usage.json", "utf8")); } catch {}
        fs.writeFileSync(".forge/candidate.meta.json", JSON.stringify({
          attempt_base: process.env.FORGE_ATTEMPT_BASE || "",
          driver: "grok-build",
          model: process.env.FORGE_HARNESS_MODEL || "",
          exit: process.env.FORGE_DRIVER_EXIT || "completed",
          usage,
        }));
      '
    # Machine-readable contract. FORGE_CANDIDATE points at the artifact the
    # backend downloads; the legacy FORGE_RESULT line stays only for the
    # v0.2 → v0.3 migration window and carries the attempt base — it is not
    # a branch claim anymore.
    - 'printf "FORGE_CANDIDATE:{\"attempt_base\": \"%s\", \"artifact\": \"candidate.diff\", \"exit\": \"%s\"}\n" "$FORGE_ATTEMPT_BASE" "$FORGE_DRIVER_EXIT"'
    - 'printf "FORGE_RESULT:{\"head\": \"%s\", \"summary\": \"candidate artifacts; proposal-only lane\"}\n" "$FORGE_ATTEMPT_BASE"'
  artifacts:
    paths:
      - .forge/candidate.diff
      - .forge/candidate.meta.json
    when: always
    expire_in: 1 week

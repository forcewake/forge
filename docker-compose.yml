# Set FORGE_CONFIG_DIRECTORY and FORGE_ENV_FILE to private absolute paths.
# /etc/forge/forge.toml must use blob_directory = "/data/blobs", the PG URL
# from the private env file, and an explicitly configured strict HTTPS gateway.
# Include the reviewed pricing policy and any private CA in that config directory.
# First installation is explicit and only for an empty database:
#   docker compose build
#   docker compose up -d postgres
#   docker compose run --rm --no-deps app forge --config /etc/forge/forge.toml install
#   docker compose up -d app worker
x-forge: &forge
  image: forge:1.0.0-local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${FORGE_ENV_FILE:?Set FORGE_ENV_FILE to the private runtime environment file}
  volumes:
    - ${FORGE_CONFIG_DIRECTORY:?Set FORGE_CONFIG_DIRECTORY to the private config directory}:/etc/forge:ro
    - forge-data:/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *forge
    command: ["forge", "--config", "/etc/forge/forge.toml", "serve", "--host", "0.0.0.0", "--port", "8420"]
    ports:
      - "${FORGE_BIND_ADDRESS:-127.0.0.1}:8420:8420"

  worker:
    <<: *forge
    command: ["forge", "--config", "/etc/forge/forge.toml", "worker"]
    healthcheck:
      disable: true

  postgres:
    image: postgres:17.8
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${FORGE_POSTGRES_PASSWORD:?Set the password used by the private runtime PG URL}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  forge-data:
  postgres-data:

name: security-triage
type: security-triage
version: "1.0"
description: >
  Triages security scan findings from SAST, DAST, and dependency scanning.
  Filters false positives and prioritizes real vulnerabilities.
  Auto-triggers on security job completion (opt-in per project via .forge.yml enabled_agents).

trigger:
  events:
    - build.success
  job_names:
    - semgrep-sast
    - sast
    - bandit-sast
    - gemnasium-dependency_scanning
    - dependency_scanning
    - dast
    - secret_detection
    - container_scanning
  cooldown: 600

model:
  default: strong

context:
  needs_security_reports: true
  needs_diff: false

# v0.7: the durable /security step feeds severity-sorted batches of up to
# 50 findings per call; this raises the prompt cap accordingly (reactive
# triggers keep the default 20 — settings merge per definition).
settings:
  max_findings: 50

system_prompt: |
  You are a senior application security engineer triaging automated scan findings
  for the project {project_path}.

  ## Your Task
  1. Review each finding from the security scanner
  2. Assess whether it is a true positive or false positive
  3. For true positives, provide severity, description, and remediation
  4. Prioritize by severity: critical > high > medium > low
  5. Flag common false positive patterns

  ## Guidelines
  - A finding is a FALSE POSITIVE if:
    - The code uses parameterized queries but scanner flagged SQL injection
    - The "secret" is a test/example value, not a real credential
    - The vulnerable function is never called with user input
    - The flagged pattern is a common false positive for this scanner
  - A finding NEEDS REVIEW if you can't determine with certainty
  - Be conservative: when in doubt, say it's confirmed, not false_positive
  - For confirmed findings, provide specific remediation with code
  - Focus on OWASP Top 10 categories for classification
  - Cross-reference with the diff to see if the finding is in new/modified code

output:
  format: json

actions:
  inline_comments: false
  summary_note: true
  labels: true

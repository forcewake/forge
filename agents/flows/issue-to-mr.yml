name: issue-to-mr
version: "1.0"
description: >
  Analyze a GitLab issue, create an implementation plan,
  generate code changes, and open a merge request.

trigger:
  command: "@forge /implement"
  target: issue

timeout: 1800  # 30 minutes

steps:
  - name: analyze
    agent: chat
    action: analyze_issue
    output_key: analysis
    timeout: 120

  - name: plan
    type: action
    action: post_comment
    params:
      target: issue
      body: "## Implementation Plan\n\n{analysis.plan}\n\n*Starting implementation...*"

  - name: create_branch
    type: action
    action: create_branch
    output_key: branch
    params:
      branch_name: "forge/issue-{issue.iid}"
      ref: "{project.default_branch}"

  - name: implement
    agent: chat
    action: generate_code
    input_from: analysis
    output_key: implementation
    timeout: 300

  - name: self_review
    agent: code-reviewer
    input_from: implementation
    output_key: review
    timeout: 180

  - name: open_mr
    type: action
    action: open_merge_request
    condition: "review.severity != 'critical'"
    output_key: mr
    params:
      source_branch: "{branch.name}"
      target_branch: "{project.default_branch}"
      title: "Resolve issue: {issue.title}"
      description: "Auto-generated implementation.\n\n{analysis.summary}\n\n*Generated by Forge*"
      labels:
        - "forge-generated"

  - name: notify
    type: action
    action: post_comment
    params:
      target: issue
      body: "Implementation complete. Merge request opened: {mr.url}"
